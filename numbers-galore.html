<title>Numbers Galore Platform</title>
<!-- Without this a phone lays the page out at desktop width and zooms the
     whole thing out to about a third — every control lands under the size a
     finger can hit. The artifact host injects one; a file opened straight
     from disk gets nothing, so it is declared here too. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Multi-game gaming platform backend — Keno plus a pluggable game registry, agent hierarchy, wallet ledger and operator consoles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

<style>
/* ============================================================================
   NUMBERS GALORE — design tokens
   Dark-first operator surface. Gold is the winning ball / jackpot (domain
   material, spent in one place). Jade = win, rose = loss, violet = 2nd data.
   ========================================================================== */
:root {
  --bg:        #f4f2ec;
  --surface:   #ffffff;
  --surface-2: #ece7db;
  --surface-3: #e2dccb;
  --line:      #d8d1bd;
  --line-soft: #e6e0d0;
  --ink:       #1b1e26;
  --ink-2:     #4a4f5e;
  --ink-dim:   #7a7f8e;
  --gold:      #b8860b;
  --gold-bg:   #f5e6c0;
  --jade:      #1f9d63;
  --jade-bg:   #d6efe0;
  --rose:      #d13a4e;
  --rose-bg:   #f7dbdf;
  --violet:    #6b5fd1;
  --violet-bg: #e4e0f7;
  --focus:     #b8860b;
  --shadow:    0 1px 2px rgba(20,22,28,.06), 0 8px 24px -12px rgba(20,22,28,.18);
  --radius:    10px;
  --radius-sm: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0b0f1a;
    --surface:   #131a2b;
    --surface-2: #1a2338;
    --surface-3: #212c46;
    --line:      #2c3855;
    --line-soft: #202a42;
    --ink:       #e9edf7;
    --ink-2:     #b3bed6;
    --ink-dim:   #8a97b4;
    --gold:      #f5c451;
    --gold-bg:   #342f1c;
    --jade:      #3ddc91;
    --jade-bg:   #10362a;
    --rose:      #ff5d73;
    --rose-bg:   #3a1a22;
    --violet:    #a99bff;
    --violet-bg: #241f3f;
    --focus:     #f5c451;
    --shadow:    0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  --bg:        #0b0f1a;
  --surface:   #131a2b;
  --surface-2: #1a2338;
  --surface-3: #212c46;
  --line:      #2c3855;
  --line-soft: #202a42;
  --ink:       #e9edf7;
  --ink-2:     #b3bed6;
  --ink-dim:   #8a97b4;
  --gold:      #f5c451;
  --gold-bg:   #342f1c;
  --jade:      #3ddc91;
  --jade-bg:   #10362a;
  --rose:      #ff5d73;
  --rose-bg:   #3a1a22;
  --violet:    #a99bff;
  --violet-bg: #241f3f;
  --focus:     #f5c451;
  --shadow:    0 1px 2px rgba(0,0,0,.3), 0 16px 40px -16px rgba(0,0,0,.55);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  font-size: 14.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 {
  font-family: "Bricolage Grotesque", "IBM Plex Sans", sans-serif;
  font-weight: 700;
  margin: 0;
  text-wrap: balance;
  letter-spacing: -0.01em;
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
/* The focus ring has to survive both the light operator surface and the dark
   game cabinets, so it carries its own white keyline underneath. */
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; box-shadow: 0 0 0 4px rgba(255,255,255,.75); }
/* Available to assistive technology, invisible on screen. */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* ---- shell ---------------------------------------------------------------- */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
@media (max-width: 900px) { .app { grid-template-columns: 1fr; } }

.rail {
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: 18px 14px;
  display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
@media (max-width: 900px) {
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px; }
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 16px; }
.brand .dot {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: radial-gradient(circle at 32% 30%, var(--gold), #7a5a12 78%);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 2px 8px -2px rgba(0,0,0,.4);
  display: grid; place-items: center;
  font-family: "Bricolage Grotesque"; font-weight: 800; color: #1b1204; font-size: 15px;
}
.brand b { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 15.5px; letter-spacing: -0.02em; }
.brand span { display: block; font-size: 10.5px; color: var(--ink-dim); letter-spacing: .08em; text-transform: uppercase; }
@media (max-width: 900px) { .brand { padding: 0 8px 0 0; } .brand span { display: none; } }

.nav-group { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); padding: 14px 8px 6px; }
@media (max-width: 900px) { .nav-group { display: none; } }
.nav {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px; border-radius: var(--radius-sm);
  color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 13.5px;
  border: 1px solid transparent; cursor: pointer; background: none; width: 100%; text-align: left;
}
.nav:hover { background: var(--surface-2); color: var(--ink); }
.nav.on { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.nav .ic { width: 16px; text-align: center; opacity: .8; flex: none; }
.nav small { margin-left: auto; font-size: 10px; color: var(--ink-dim); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 22px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 20; flex-wrap: wrap;
}
.who { display: flex; align-items: center; gap: 9px; }
.who .av {
  width: 26px; height: 26px; border-radius: 50%; flex: none;
  background: var(--violet-bg); color: var(--violet);
  display: grid; place-items: center; font-weight: 700; font-size: 12px;
}
.who b { font-size: 13px; }
.who span { font-size: 11px; color: var(--ink-dim); }
.bal {
  margin-left: auto; display: flex; align-items: baseline; gap: 7px;
  padding: 6px 12px; border-radius: 999px; background: var(--gold-bg);
  border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent);
}
.bal .k { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: color-mix(in srgb, var(--gold) 75%, var(--ink)); }
.bal .v { font-family: "IBM Plex Mono"; font-weight: 600; font-size: 15px; color: color-mix(in srgb, var(--gold) 80%, var(--ink)); }

.switcher { display: flex; gap: 5px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--surface);
  padding: 5px 11px; border-radius: 999px; font-size: 12px; cursor: pointer;
  display: flex; align-items: center; gap: 6px; color: var(--ink-2);
}
.chip:hover { border-color: var(--ink-dim); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .r { font-size: 9.5px; opacity: .7; text-transform: uppercase; letter-spacing: .06em; }

.icon-btn {
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-size: 14px;
}
.icon-btn:hover { border-color: var(--ink-dim); }

.view { padding: 22px; max-width: 1180px; width: 100%; margin: 0 auto; flex: 1; }
.view-head { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.view-head h1 { font-size: 24px; font-weight: 800; }
.view-head p { margin: 3px 0 0; color: var(--ink-dim); font-size: 13px; }
.view-head .sp { margin-left: auto; }

/* ---- primitives --------------------------------------------------------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.pad { padding: 16px 18px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 15px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px;
  cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--ink-dim); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #1b1204; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: none; }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.danger { color: var(--rose); border-color: color-mix(in srgb, var(--rose) 40%, var(--line)); }

label.f { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 5px; }
input.i, select.i {
  width: 100%; padding: 8px 11px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
input.i:focus, select.i:focus { outline: none; border-color: var(--focus); }

.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px;
  border-radius: 999px; font-size: 11px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);
}
.pill.ok  { background: var(--jade-bg); color: var(--jade); border-color: color-mix(in srgb, var(--jade) 30%, transparent); }
.pill.bad { background: var(--rose-bg); color: var(--rose); border-color: color-mix(in srgb, var(--rose) 30%, transparent); }
.pill.warn{ background: var(--gold-bg); color: color-mix(in srgb, var(--gold) 82%, var(--ink)); border-color: color-mix(in srgb, var(--gold) 30%, transparent); }
.pill.dim { opacity: .7; }

table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
table.tbl th {
  text-align: left; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-dim); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--surface);
}
table.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); }
table.tbl tr:last-child td { border-bottom: none; }
table.tbl tr:hover td { background: var(--surface-2); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

.grid-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; margin-bottom: 20px; }
.metric { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.metric .k { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
.metric .v { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 25px; margin-top: 6px; letter-spacing: -0.02em; }
.metric .sub { font-size: 11.5px; color: var(--ink-dim); margin-top: 2px; }
.metric .v.jade { color: var(--jade); } .metric .v.rose { color: var(--rose); }

.toast-wrap { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px;
  font-size: 13px; font-weight: 500; box-shadow: var(--shadow); animation: rise .3s ease;
}
.toast.bad { background: var(--rose); color: #fff; }
.toast.ok { background: var(--jade); color: #06231a; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

.modal-bg { position: fixed; inset: 0; background: rgba(6,9,16,.55); display: grid; place-items: center; z-index: 150; padding: 20px; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: min(460px, 100%); box-shadow: var(--shadow); }
.modal h3 { font-size: 17px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.modal .body { padding: 18px; display: flex; flex-direction: column; gap: 13px; }
.modal .foot { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

/* ============================================================================
   KENO game view
   ========================================================================== */

.game-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.game-tab {
  padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-2);
  display: flex; align-items: center; gap: 8px;
}
.game-tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.game-tab:disabled { opacity: .4; cursor: not-allowed; }

.board {
  display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
}
@media (max-width: 520px) { .board { grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 8px; } }
.spot {
  aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink-2);
  font-family: "IBM Plex Mono"; font-weight: 500; font-size: 13.5px;
  display: grid; place-items: center; cursor: pointer; position: relative;
  transition: transform .08s ease, background .12s ease;
}
@media (max-width: 520px) { .spot { font-size: 12px; } }
.spot:hover { border-color: var(--gold); }
.spot.pick { background: var(--gold); border-color: var(--gold); color: #1b1204; font-weight: 600; }
.spot.drawn { border-color: var(--violet); box-shadow: inset 0 0 0 2px var(--violet); }
.spot.hit { background: var(--jade); border-color: var(--jade); color: #06231a; font-weight: 700; }
.spot:disabled { cursor: not-allowed; }

/* ---- Keno: penthouse-lounge treatment ------------------------------------ */
.keno-wrap { --kgold: #f5c451; --kgold-deep: #b8860b; display: flex; flex-direction: column; gap: 16px; }

/* ---- the cabinet header: the reference art, as-is, with live overlays ---- */
/* container-type + a fixed aspect-ratio matching the source crop 1:1 means
   every cqw position below lands on the exact pixel it was measured from,
   at any render width — the same trick the Just 6 display uses. */
.keno-display-wrap {
  container-type: inline-size; position: relative; overflow: hidden;
  display: grid; place-items: center;
  aspect-ratio: 1536 / 440; border-radius: 14px; background: #060912;
  border: 1px solid rgba(245,196,81,.22);
  box-shadow: 0 20px 50px -24px rgba(0,0,0,.7);
}
.keno-display-img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* Everything registered to the art lives in here together, and this box keeps
   the source aspect ratio whatever the band around it does — so every % put on
   the sphere, the icons and the Draw box stays on the pixel it was measured
   from. Magnifying it moves the picture and its overlays as one piece. */
.keno-display-zoom { position: relative; width: 100%; aspect-ratio: 1536 / 440; }
@media (max-width: 820px) {
  /* Unzoomed, the machine lands at about sixty pixels on a phone — a thumbnail
     of the one thing the screen is about. A taller band and a scale centred on
     the sphere give it back its size; the logo and the painted Draw box fall
     outside the crop, and neither is wanted here (the read-out has already
     stepped out into a panel of its own). */
  .keno-display-wrap { aspect-ratio: 16 / 9; }
  .keno-display-zoom { transform: scale(2); transform-origin: 48.83% 50.68%; }
  /* the art's own icons are outside the crop now, so ours take the corner */
  .keno-display-icon { transform: none; top: 8px !important; left: auto !important; }
  .keno-display-icon[data-fk="home"] { right: 8px; }
  .keno-display-icon[data-fk="sound"] { right: 58px; }
}
.keno-display-icon { position: absolute; transform: translate(-50%, -50%); z-index: 5; }
/* Descendant selector beats the plain .j6-iconbtn rule regardless of source
   order, so the icon scales with the image instead of staying a fixed 38px
   (which would swamp the art once it is rendered narrow on a phone).
   The disc is near-opaque on purpose: the art already paints a speaker and a
   house here, and a translucent button let both show through at once. This
   covers the painted glyph so there is exactly one icon, and it is the live
   one — the speaker has to be able to show a muted state the art cannot. */
.keno-display-wrap .j6-iconbtn {
  width: 6cqw; height: 6cqw; min-width: 34px; min-height: 34px;
  background: rgba(7,11,18,.85); border-color: rgba(240,228,200,.5); color: #f4ecd8;
}
.keno-display-wrap .j6-iconbtn:hover { background: rgba(20,28,42,.92); }
.keno-display-wrap .j6-iconbtn svg { width: 55%; height: 55%; }
@media (pointer: coarse) { .keno-display-wrap .j6-iconbtn { min-width: 44px; min-height: 44px; } }

/* ---- the tumbler: physics balls churning inside the glass sphere --------- */
/* Same model as Just 6's drum (J6_PHYS) — a round vessel this time, so a
   plain circle() clip does what Just 6 needed a hand-traced polygon for. */
.keno-drum {
  position: absolute; pointer-events: none; opacity: 0; border-radius: 50%;
  overflow: hidden;                      /* nothing escapes the glass */
  transition: opacity .4s ease;
}
.keno-display-wrap.drawing .keno-drum { opacity: 1; }
/* The interior, inset so the painted glass rim, its highlights and the tube
   all survive underneath. Colour sampled from inside the sphere in the art,
   so it reads as the dark room seen through glass rather than a hole cut in
   the picture. Deliberately left part-transparent: the city and the glass
   behind still come through, and what it half-hides is the pile of balls
   painted at rest in the bottom of the sphere — which, being balls, reads as
   balls settled under the ones churning above them. */
.keno-drum::before {
  content: ""; position: absolute; inset: 5%; border-radius: 50%; z-index: 0;
  background: radial-gradient(120% 100% at 44% 26%, rgba(42,46,78,.46), rgba(10,13,26,.64) 74%);
}
.keno-drum::after {
  content: ""; position: absolute; inset: 5%; z-index: 4; border-radius: 50%; pointer-events: none;
  background:
    radial-gradient(90% 70% at 36% 20%, rgba(255,255,255,.16), transparent 52%),
    radial-gradient(100% 100% at 48% 55%, transparent 34%, rgba(2,4,10,.5) 94%);
}
.keno-drum-balls { position: absolute; inset: 0; }
.keno-drum .kball {
  position: absolute; left: 0; top: 0;
  --bs: 3.4cqw; width: var(--bs); height: var(--bs);
  margin: calc(var(--bs) / -2) 0 0 calc(var(--bs) / -2);
  will-change: transform;
}
@media (prefers-reduced-motion: reduce) { .keno-drum .kball { transform: translate(var(--fx), var(--fy)); } }

/* ---- the drawn ball, enlarged in front of the sphere before it joins Draw: */
.keno-reveal {
  position: absolute; --bs: 12cqw;
  transform: translate(-50%, -50%) scale(.2); opacity: 0;
  transition: transform .22s cubic-bezier(.2,.9,.3,1.2), opacity .18s ease;
  pointer-events: none; z-index: 6;
  box-shadow: inset 0 -3px 8px rgba(0,0,0,.22), 0 .12em .5em -.04em rgba(0,0,0,.8), 0 0 2em .2em rgba(245,196,81,.35);
}
.keno-reveal.show { transform: translate(-50%, -50%) scale(1); opacity: 1; transition: transform .3s cubic-bezier(.22,.85,.3,1.04), opacity .16s ease; }
.keno-reveal.fade { transition: opacity .2s ease; opacity: 0; }
@media (prefers-reduced-motion: reduce) { .keno-reveal { transition: none; } }

/* ---- the draw panel, sitting exactly on the art's own "Draw:" box -------- */
/* Wide, it sits exactly on the box the art paints. Narrow, that box is about
   forty pixels tall — nowhere near enough for twenty legible numbers — so it
   steps out of the picture and becomes a panel of its own underneath. */
.keno-stage { position: relative; container-type: inline-size; }
.keno-drawpanel {
  position: absolute; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px;
  padding: 7px; overflow: auto;
}
.kdraw-lbl {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}
@media (max-width: 820px) {
  .keno-drawpanel {
    position: static; width: auto !important; height: auto !important; min-height: 46px;
    margin: 10px 12px 0; padding: 9px 10px; align-items: center;
    background: #090c0f; border: 1px solid var(--kline); border-radius: 11px;
  }
  .kdraw-lbl {
    position: static; width: auto; height: auto; clip-path: none;
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--kdim); margin-right: 4px;
  }
}
.keno-dchip {
  font-family: "IBM Plex Mono"; font-weight: 600;
  --bs: max(20px, 2.3cqw); width: var(--bs); height: var(--bs); font-size: max(10px, calc(var(--bs) * .46));
  display: grid; place-items: center; border-radius: 50%; flex: none;
  color: #1a1f2b; background: radial-gradient(circle at 32% 26%, #ffffff, #dfe3ec 55%, #aab2c4);
  border: 1px solid rgba(0,0,0,.15); animation: kchip .3s ease both;
}

.ball {
  aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  font-family: "IBM Plex Mono"; font-weight: 600; font-size: 13px;

.j6-rhrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }

.j6-ball.pre { box-shadow: inset 0 0 0 .07em rgba(0,0,0,.32), 0 .09em .2em -.05em rgba(0,0,0,.6), 0 0 0 2px var(--gold, #d4af37); }

.paytable-mini { width: 100%; border-collapse: collapse; font-family: "IBM Plex Mono"; font-size: 12px; }
.paytable-mini th, .paytable-mini td { padding: 5px 8px; text-align: center; border-bottom: 1px solid var(--line-soft); }

.paytable-mini td:first-child { text-align: left; color: var(--ink-dim); }

.tnode { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line-soft); background: var(--surface); }
.tnode:hover { background: var(--surface-2); }
.tnode .kind { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; background: var(--surface-3); color: var(--ink-2); }
.tnode .kind.super { background: var(--violet-bg); color: var(--violet); }
.tnode .kind.master { background: var(--gold-bg); color: color-mix(in srgb, var(--gold) 82%, var(--ink)); }
.tnode .kind.agent { background: var(--jade-bg); color: var(--jade); }

.empty-state .em { font-size: 30px; margin-bottom: 8px; }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 800px) { .split { grid-template-columns: 1fr; } }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* ============================================================================
   JUST 6 — one game cabinet: the operator's display art on top, a toolbar,
   then the number grid and the speciality bets.

   Two rules hold this together:
   • the display is a fixed-ratio raster, so everything drawn over it is sized
     in `cqw` (1% of the display's own width) — it stays registered to the
     printed circles at every viewport, phone included;
   • nothing is signalled by colour alone. Picked / drawn / hit each change
     shape or weight as well as hue, and every control carries a real name.
   ========================================================================== */
.j6-wrap { --jp: #a259ff; --jp-deep: #4c1d95; --jp-blue: #2f6fed; --jp-blue-deep: #1a3f9e; }
.j6-board { grid-template-columns: repeat(8, 1fr); }
@media (max-width: 560px) { .j6-board { grid-template-columns: repeat(6, 1fr); } }
.j6-wrap .board {
  background: linear-gradient(180deg, #1c1033, #120a24);
  border-color: rgba(162,89,255,.25);
}
.j6-wrap .spot {
  background: radial-gradient(circle at 50% 28%, #2c1a4d, #180f2c 78%);
  border: 1px solid rgba(162,89,255,.22); color: #d7cdf0;
  min-height: 34px;
}
@media (pointer: coarse) { .j6-wrap .spot { min-height: 44px; } }
.j6-wrap .spot:hover:not([aria-disabled="true"]) { border-color: var(--jp); color: #fff; }
/* picked: filled instead of outlined, and heavier — not just "a different colour" */
.j6-wrap .spot[aria-pressed="true"] {
  background: radial-gradient(circle at 50% 28%, #cfa8ff, var(--jp) 75%);
  border-color: var(--jp); color: #1c0a33; font-weight: 700;
}
/* drawn but not yours: a dashed ring. yours and drawn: a solid double ring. */
.j6-wrap .spot.drawn { border-style: dashed; border-color: rgba(124,255,203,.85); color: #eafff6; }
.j6-wrap .spot.hit {
  background: radial-gradient(circle at 50% 28%, #ecd9ff, var(--jp) 60%, var(--jp-deep));
  border-color: #fff; color: #fff; font-weight: 800;
  box-shadow: 0 0 0 2px var(--jp), 0 0 16px -2px var(--jp);
  animation: khit .5s ease;
}
@media (prefers-reduced-motion: reduce) { .j6-wrap .spot.hit { animation: none; } }
.j6-wrap .spot[aria-disabled="true"] { opacity: .7; cursor: not-allowed; }

/* ---- the whole cabinet: one dark panel ---- */
.j6-screen {
  border-radius: 16px; overflow: hidden; position: relative;
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(162,89,255,.2), transparent 62%),
    linear-gradient(180deg, #1a0f38, #0d0720 60%);
  border: 1px solid rgba(162,89,255,.28);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 20px 50px -24px rgba(0,0,0,.7);
}

/* ---- the display: the art, plus every live overlay ----------------------- */
.j6-display-wrap {
  position: relative; width: 100%; line-height: 0;
  container-type: inline-size;            /* 1cqw = 1% of the display's width */
}
.j6-display-img { width: 100%; display: block; }
/* The cabinet itself holds still while it draws — the movement that matters
   is inside the glass, and shaking the paytable with it only made the printed
   figures harder to read. */

/* ---- a real lottery ball ------------------------------------------------- */
/* Solid moulded colour, a specular highlight top-left, bounce light off the
   floor, a darkened rim and an engraved ring around the number — the look of
   the physical ball, built from the ball's own colour so any of the eight
   works. `--bs` is the ball's diameter; everything else scales off it. */
.j6-ball {
  --bs: 30px; --bc: #3a2a5c; --tc: #fff;
  position: relative; width: var(--bs); height: var(--bs); flex: none;
  border-radius: 50%; display: grid; place-items: center;
  font-family: "Bricolage Grotesque"; font-weight: 800; line-height: 1;
  font-size: max(7px, calc(var(--bs) * .44)); color: var(--tc);
  background:
    radial-gradient(circle at 50% 116%, rgba(255,255,255,.26), rgba(255,255,255,0) 44%),
    radial-gradient(circle at 34% 26%, rgba(255,255,255,.95) 0 3%, rgba(255,255,255,.45) 12%, rgba(255,255,255,0) 36%),
    radial-gradient(circle at 40% 34%, rgba(255,255,255,.18), rgba(255,255,255,0) 54%),
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 44%, rgba(0,0,0,.28) 76%, rgba(0,0,0,.6) 100%),
    var(--bc);
  box-shadow: inset 0 0 0 .07em rgba(0,0,0,.32), 0 .09em .2em -.05em rgba(0,0,0,.6);
  text-shadow: 0 .05em .05em rgba(0,0,0,.4);
}
.j6-ball::before {                      /* the engraved ring the number sits in */
  content: ""; position: absolute; inset: 13%; border-radius: 50%;
  border: .045em solid rgba(0,0,0,.3);
  box-shadow: inset 0 0 0 .035em rgba(255,255,255,.14);
}
.j6-ball > span { position: relative; }  /* number above the ring */

/* ---- balls sitting in their printed circles ------------------------------ */
.j6-slot {
  position: absolute; transform: translate(-50%, -50%);
  --bs: 4.14cqw; width: var(--bs); height: var(--bs);
  border-radius: 50%; pointer-events: none;
}
.j6-slot.pre { --bs: 4.66cqw; }
.j6-slot:not(.j6-ball) { background: none; box-shadow: none; }   /* empty circle: show the art */
/* The pop belongs to the moment a ball lands, so it is a class the draw adds —
   not something every ball replays whenever the screen happens to re-render. */
.j6-slot.land { animation: j6pop .34s cubic-bezier(.3,1.3,.5,1) both; }
@keyframes j6pop {
  0%   { transform: translate(-50%, -50%) scale(.45); opacity: 0; }
  70%  { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); }
}
/* your number, and the ball that closed a winning line — both add a ring
   rather than changing the ball's own colour, which carries its own meaning */
.j6-slot.hit  { box-shadow: 0 0 0 .1em #fff, 0 0 0 .19em #ffd75e, 0 0 1.1em .06em rgba(255,215,94,.85); }
.j6-slot.close { box-shadow: 0 0 0 .12em #ffd75e, 0 0 0 .24em #fff, 0 0 1.4em .12em #fff; }

/* ---- the tumbler: balls churning inside the machine's glass -------------- */
/* Clipped to the cavity outline traced off the art, and filled with the
   cavity's own black, so it reads as the inside of the machine rather than a
   panel stuck on top of it. Runs from Play until the last ball lands. */
.j6-drum {
  position: absolute; pointer-events: none; opacity: 0;
  transition: opacity .4s ease;
  background: radial-gradient(120% 90% at 42% 26%, #150c26, #04020a 72%);
}
.j6-display-wrap.drawing .j6-drum { opacity: 1; }
/* Glass tint over the tumbling balls: the ones painted into the art sit behind
   a dark curved pane, and without this the live ones read as stickers on top
   of it rather than objects inside it. */
.j6-drum::after {
  content: ""; position: absolute; inset: 0; z-index: 400; pointer-events: none;
  background:
    radial-gradient(120% 90% at 38% 22%, rgba(255,255,255,.06), transparent 46%),
    radial-gradient(100% 100% at 48% 52%, transparent 34%, rgba(4,2,10,.5) 92%);
}
/* Position, depth scale and roll all come from the physics step in JS — the
   only thing CSS does here is put each ball's centre at the origin so a plain
   translate() can place it. */
.j6-drum-balls { position: absolute; inset: 0; }
.j6-drum .j6-ball {
  position: absolute; left: 0; top: 0;
  --bs: 4cqw; margin: calc(var(--bs) / -2) 0 0 calc(var(--bs) / -2);
  will-change: transform;
}
/* No physics under reduced motion: the balls just sit where they were spawned. */
@media (prefers-reduced-motion: reduce) {
  .j6-drum .j6-ball { transform: translate(var(--fx), var(--fy)); }
}

/* ---- the hatch on the machine's right flank ---- */
/* The art paints a grey oval port there. This sits exactly on top of it and
   swings open on its hinge each time a ball is released. */
.j6-hatch {
  position: absolute; width: 2.7cqw; height: 3.5cqw; z-index: 2;
  transform: translate(-50%, -50%) rotate(-9deg);
  perspective: 70px; pointer-events: none;
}
.j6-hatch-hole {
  position: absolute; inset: -4%; border-radius: 50%;
  background: radial-gradient(circle at 42% 34%, #241636, #04020a 72%);
  box-shadow: inset 0 0 .35em rgba(0,0,0,.95);
  opacity: 0; transition: opacity .1s ease;
}
.j6-hatch-lid {
  position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 36% 28%, #efecf6, #bdb6d0 52%, #6d6683 100%);
  box-shadow: 0 0 0 .055em rgba(18,10,32,.9), inset 0 .07em .12em rgba(255,255,255,.75);
  transform-origin: 10% 50%; backface-visibility: hidden;
  transition: transform .16s cubic-bezier(.4,0,1,1);
}
.j6-hatch.open .j6-hatch-hole { opacity: 1; }
.j6-hatch.open .j6-hatch-lid { transform: rotateY(-112deg); transition-timing-function: cubic-bezier(0,.6,.3,1); }
@media (prefers-reduced-motion: reduce) { .j6-hatch-lid { transition: none; } }

/* ---- the drawn ball, enlarged over the machine --------------------------- */
/* A coin-flip in (scaleX 0→1, turning to face you), a hold long enough to
   read, then a cross-fade back to the machine — timed off the reference. */
.j6-reveal {
  /* Just under the width of the glass, and sitting a little high in it, so a
     rim of churning balls stays visible underneath the whole way through.
     --hx/--hy is the offset from here back to the hatch, where it starts. */
  position: absolute; --bs: 16.5cqw; --hx: 10.9cqw; --hy: 8.2cqw;
  transform: translate(calc(-50% + var(--hx)), calc(-50% + var(--hy))) scale(.055); opacity: 0;
  box-shadow: inset 0 0 0 .07em rgba(0,0,0,.32), 0 .12em .5em -.04em rgba(0,0,0,.8), 0 0 2em .2em rgba(162,89,255,.35);
  transition: transform .22s cubic-bezier(.2,.9,.3,1.2), opacity .18s ease;
  pointer-events: none; z-index: 3;
}
/* out: just clear of the port, still small. show: swelled to fill the glass. */
.j6-reveal.out  { transform: translate(calc(-50% + var(--hx)), calc(-50% + var(--hy))) scale(.14); opacity: 1; transition: transform .1s ease-out, opacity .1s ease-out; }
.j6-reveal.show { transform: translate(-50%, -50%) scale(1); opacity: 1; transition: transform .38s cubic-bezier(.22,.85,.3,1.04), opacity .16s ease; }
.j6-reveal.fade { transition: opacity .2s ease; opacity: 0; }

@media (prefers-reduced-motion: reduce) {
  .j6-drum-balls, .j6-drum .j6-ball,
  .j6-slot.land { animation: none; }
  .j6-reveal { transition: none; }
}

/* ---- Results Round ------------------------------------------------------- */
.j6-results { padding: 20px 16px; text-align: center; }
.j6-results h3 {
  font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 20px; letter-spacing: .14em;
  text-transform: uppercase; color: #7CFFCB; margin-bottom: 14px;
}
.j6-results-pre { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.j6-results-pre .j6-ball { --bs: 36px; }
.j6-results-sub { font-size: 12.5px; color: #c4b6e6; margin-bottom: 16px; }
.j6-results-sub b { color: #fff; }
.j6-results-grid {
  display: grid; grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 10px 6px; max-width: 620px; margin: 0 auto;
}
@media (max-width: 560px) { .j6-results-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.j6-results-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.j6-results-cell .j6-ball { --bs: 30px; }
.j6-results-cell .mult { font-family: "IBM Plex Mono"; font-size: 10.5px; color: #c4b6e6; }
.j6-results-close {
  margin-top: 18px; min-height: 44px; padding: 10px 26px; border-radius: 999px; cursor: pointer;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.4); color: #fff;
  font-weight: 600; font-size: 13.5px;
}
.j6-results-close:hover { background: rgba(255,255,255,.2); }

/* ---- toolbar: home / sound … PLAY … clear / stake ------------------------ */
.j6-toolbar {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; flex-wrap: wrap;
  background: rgba(0,0,0,.28); border-top: 1px solid rgba(162,89,255,.18); border-bottom: 1px solid rgba(162,89,255,.18);
}
.j6-toolbar-side { display: flex; align-items: center; gap: 6px; }
.j6-toolbar-side.right { margin-left: auto; }
/* Line-drawn icons in currentColor rather than emoji: emoji render as a dark
   glyph on this near-black toolbar (well under the 3:1 a non-text control
   needs) and change shape on every platform. */
.j6-iconbtn {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.26);
  color: #ece5fb; cursor: pointer;
}
.j6-iconbtn:hover:not([aria-disabled="true"]) { background: rgba(255,255,255,.12); }
.j6-iconbtn[aria-pressed="false"] { opacity: .55; }
.j6-iconbtn[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }
.j6-playpill {
  flex: none; padding: 12px 34px; min-height: 48px; border-radius: 999px; cursor: pointer;
  font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 15px; letter-spacing: .1em; text-transform: uppercase;
  background: linear-gradient(180deg, #cfa8ff, var(--jp) 55%, var(--jp-deep)); border: 1px solid var(--jp-deep); color: #fff;
  box-shadow: 0 6px 18px -6px rgba(162,89,255,.6);
}
.j6-playpill:hover:not([aria-disabled="true"]) { filter: brightness(1.06); }
.j6-playpill[aria-disabled="true"] { opacity: .55; cursor: not-allowed; box-shadow: none; }
.j6-betstepper {
  display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 12px; border-radius: 999px;
  background: linear-gradient(180deg, var(--jp-blue), var(--jp-blue-deep)); border: 1px solid #0f2c72;
}
.j6-betstepper .lbl { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 12px; color: #fff; }
.j6-betstepper .val { font-family: "IBM Plex Mono"; font-weight: 700; font-size: 13px; color: #fff; min-width: 30px; text-align: center; }
.j6-betstepper button {
  width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
  background: rgba(255,255,255,.18); color: #fff; font-size: 13px; display: grid; place-items: center;
}
.j6-betstepper button:hover:not([aria-disabled="true"]) { background: rgba(255,255,255,.3); }
.j6-betstepper button[aria-disabled="true"] { opacity: .4; cursor: not-allowed; }
/* On a phone the play control gets its own full-width row — the one thing a
   thumb reaches for most, and the only one that can afford the space. */
@media (max-width: 600px) {
  .j6-toolbar { justify-content: space-between; }
  .j6-playpill { order: 3; flex: 1 0 100%; }
}
/* Narrow enough that the two icon clusters and the stepper stop fitting on one
   row together. The word "Bet" is dropped rather than any tap target: the
   group is already named "Stake per line" for assistive tech, and the blue
   stepper next to a points figure reads as a stake without it. */
@media (max-width: 430px) {
  .j6-betstepper { padding-left: 6px; gap: 6px; }
  .j6-betstepper .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
}

/* ---- bottom: number grid (left) + quick pick / colour / speciality ------- */
.j6-bottom { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; padding: 14px; align-items: start; }
@media (max-width: 760px) { .j6-bottom { grid-template-columns: 1fr; } }
.j6-sidecol { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.j6-fieldhead { font-size: 11px; color: #c4b6e6; letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 6px; }
/* .muted is a light-surface token; inside this dark cabinet it lands at about
   3:1, under what 12px body text needs. The hint gets the panel's own ink. */
.j6-hint { margin: 0; font-size: 12.5px; line-height: 1.45; color: #c4b6e6; }
.j6-fieldhead b { color: #fff; letter-spacing: 0; text-transform: none; font-size: 12px; }
.j6-randomrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.j6-randbtn { border: 1px solid rgba(162,89,255,.3); background: rgba(162,89,255,.1); color: #e9defa; border-radius: 7px; padding: 8px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer; min-height: 38px; }
.j6-randbtn:hover:not([aria-disabled="true"]) { border-color: var(--jp); background: rgba(162,89,255,.2); }
.j6-randbtn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.j6-histlink { margin-left: auto; background: none; border: none; color: #d4c8f0; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 8px 4px; }
.j6-colourrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.j6-specgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .j6-specgrid { grid-template-columns: 1fr; } }
.j6-specgroup { min-width: 0; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: none; background: var(--surface); padding: 8px 12px; font-size: 12px; cursor: pointer; text-transform: capitalize; flex: 1; min-height: 38px; }
.seg button.on { background: var(--ink); color: var(--bg); }
.j6-wrap .seg { border-color: rgba(162,89,255,.3); }
.j6-wrap .seg button { background: rgba(255,255,255,.04); color: #d7cdf0; }
/* selected reads as filled + bold, not only as "the violet one" */
.j6-wrap .seg button[aria-pressed="true"] { background: var(--jp); color: #fff; font-weight: 700; }
.j6-wrap .seg button[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
/* Colour bets: the swatch is the colour, so the tick and the live caption
   carry the choice for anyone who can't read it off the hue. */
.swatch {
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer; padding: 0;
  border: 2px solid rgba(255,255,255,.25); display: grid; place-items: center;
  font-size: 15px; line-height: 1; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.9);
}
.swatch[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--jp); }
.swatch[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
@media (pointer: coarse) { .swatch { width: 44px; height: 44px; } }
.j6-paytable-text { padding: 0 14px 14px; }
.j6-paytable-text summary { cursor: pointer; font-size: 12.5px; color: #d4c8f0; padding: 6px 0; }
/* On a touch screen every control in here clears 44px in both directions —
   the figure a fingertip actually needs, not the 24px the spec floors at. */
@media (pointer: coarse) {
  .j6-iconbtn { width: 44px; height: 44px; }
  .j6-betstepper button { width: 44px; height: 44px; }
  .j6-randbtn { min-width: 44px; min-height: 44px; }
  .j6-histlink { min-height: 44px; padding: 8px 10px; }
  .seg button { min-height: 44px; }
  .j6-paytable-text summary { padding: 12px 0; }
}
.j6-lines { max-height: 190px; overflow-y: auto; border: 1px solid var(--line-soft); border-radius: 8px; }
.j6-lines table { width: 100%; border-collapse: collapse; font-family: "IBM Plex Mono"; font-size: 11.5px; }
.j6-lines td { padding: 4px 8px; border-bottom: 1px solid var(--line-soft); }
.j6-lines tr:last-child td { border-bottom: none; }
.j6-lines td:last-child { text-align: right; }
.cost-line { display: flex; justify-content: space-between; font-size: 12.5px; }
.cost-line.total { font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }

/* ============================================================================
   HOT DICE — the operator's table (Desktop/hot-dice.png): aubergine felt, gold
   hairlines, violet neon. The photographic band at the top carries the room,
   the podium and the glass dome; everything below it is real markup in the
   same palette, sampled from that file.
   ========================================================================== */
.hd-wrap {
  --hdf: #26092c; --hdf-2: #190620; --hdg: #f0d48a; --hdg-dim: #c2a468;
  --hdg-line: rgba(240,212,138,.34); --hdn: #a24bff;
}
.hd-cab {
  border-radius: 16px; overflow: hidden;
  background: linear-gradient(180deg, var(--hdf), var(--hdf-2) 65%);
  border: 1px solid rgba(240,212,138,.22);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 20px 50px -24px rgba(0,0,0,.8);
}

/* ---- the stage band, with the dome overlaid ------------------------------ */
.hd-stage-wrap {
  container-type: inline-size; position: relative; overflow: hidden;
  display: grid; place-items: center; aspect-ratio: 1152 / 300; background: #140518;
}
.hd-stage-zoom { position: relative; width: 100%; aspect-ratio: 1152 / 300; }
.hd-stage-img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* The dome is a small part of a wide band. On a phone the whole table would
   shrink to a thumbnail, so the band grows taller and scales on the dome —
   everything registered to the art moves with it and nothing drifts. */
@media (max-width: 860px) {
  .hd-stage-wrap { aspect-ratio: 5 / 3; }
  .hd-stage-zoom { transform: scale(2.6); transform-origin: 49.9% 41%; }
}

/* ---- dice tumbling inside the glass -------------------------------------- */
/* Clipped to the capsule the dome glass makes, so a die can never appear to
   pass through it. Position and spin come from the roll loop in JS. */
/* The dome in the art is empty glass, so this adds nothing of its own — it is
   purely the box the dice live and tumble in, clipped to the capsule the glass
   makes so none can appear to pass through it. A tinted fill was tried first
   and was wrong: the dome is transparent, and filling it read as a grey box
   pasted over the room. */
.hd-dome {
  position: absolute; pointer-events: none; overflow: hidden;
  border-radius: 50% 50% 14% 14% / 38% 38% 6% 6%;
}
.hd-dome .hd-die {
  position: absolute; margin: calc(var(--ds) / -2) 0 0 calc(var(--ds) / -2);
  will-change: transform;
}
.hd-dome-floor {
  position: absolute; left: 6%; right: 6%; bottom: 0; height: 16%;
  background: radial-gradient(80% 140% at 50% 100%, rgba(162,75,255,.55), transparent 70%);
}

/* ---- a die: one face, used small in the dome and large in the read-out ---- */
.hd-die {
  --ds: 30px; width: var(--ds); height: var(--ds); flex: none;
  border-radius: 19%; display: grid; place-items: center; position: relative;
  background: linear-gradient(158deg, #fffdf7, #f0e8d8 58%, #cdc0a6);
  box-shadow:
    inset 0 -.09em .16em rgba(90,70,40,.4), inset 0 .07em .09em rgba(255,255,255,.9),
    0 .1em .22em -.04em rgba(0,0,0,.6);
}
.hd-die .pips { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 70%; height: 70%; }
.hd-die .pip { width: 72%; height: 72%; margin: auto; border-radius: 50%; background: transparent; }
.hd-die .pip.on { background: radial-gradient(circle at 34% 30%, #4a1030, #150309); box-shadow: inset 0 .04em .05em rgba(255,255,255,.35); }

/* ---- the read-out: the result, big enough to read across the room -------- */
/* Deliberately not a timed overlay. The dome settles on the real faces, and
   this stays put until the next roll, so nobody has to catch it. */
.hd-readout {
  display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
  padding: 14px; background: rgba(0,0,0,.3); border-top: 1px solid var(--hdg-line);
}
.hd-readout-dice { display: flex; gap: 10px; }
.hd-readout .hd-die { --ds: clamp(44px, 11vw, 62px); }
.hd-readout .hd-die.land { animation: hdLand .42s cubic-bezier(.3,1.5,.5,1) both; }
.hd-readout .hd-die:nth-child(2).land { animation-delay: .07s; }
.hd-readout .hd-die:nth-child(3).land { animation-delay: .14s; }
@keyframes hdLand { 0% { transform: scale(.4) rotate(-24deg); opacity: 0; } 65% { transform: scale(1.12) rotate(6deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
.hd-readout-total { text-align: left; min-width: 0; }
.hd-readout-total .n {
  font-family: "Bricolage Grotesque"; font-weight: 800; font-size: clamp(28px, 7vw, 40px);
  line-height: 1; color: var(--hdg);
}
.hd-readout-total .l { display: block; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: #cbb8d6; margin-bottom: 3px; }
.hd-readout-total .w { display: block; font-size: 13px; margin-top: 5px; color: #d8c8e4; }
.hd-readout-total .w b { color: #7CFFCB; }
.hd-readout.idle { color: #bda9c8; font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { .hd-readout .hd-die.land { animation: none; } }

/* ---- the betting board --------------------------------------------------- */
.hd-board { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.hd-fieldhead { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #cbb8d6; display: block; margin-bottom: 7px; }
.hd-fieldhead b { color: var(--hdg); letter-spacing: 0; text-transform: none; font-size: 12px; }
.hd-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 620px) { .hd-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.hd-bars { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 480px) { .hd-bars { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.hd-hard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 560px) { .hd-hard { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

.hd-spot {
  border: 1px solid var(--hdg-line); border-radius: 9px;
  background: linear-gradient(180deg, #2d0d35, #1d0725);
  padding: 8px 5px 7px; text-align: center; cursor: pointer; position: relative;
  color: #e4d5ec; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
@media (pointer: coarse) { .hd-spot { min-height: 56px; } }
.hd-spot:hover:not([aria-disabled="true"]) { border-color: var(--hdg); color: #fff; }
/* staked reads as filled with a gold chip on it, not merely as a colour shift */
.hd-spot[aria-pressed="true"] {
  background: linear-gradient(180deg, #4a1566, #2a0a38);
  border-color: var(--hdg); box-shadow: inset 0 0 0 1px rgba(240,212,138,.45);
}
/* the winning spots after a roll: gold fill plus a white collar */
.hd-spot.hit {
  background: linear-gradient(180deg, #6a3a12, #3a1d06);
  border-color: #fff; box-shadow: 0 0 0 2px var(--hdg), 0 0 16px -2px var(--hdg);
}
.hd-spot[aria-disabled="true"] { opacity: .65; cursor: not-allowed; }
.hd-spot .t { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 15px; color: #fff; line-height: 1; }
.hd-spot .o { font-family: "IBM Plex Mono"; font-size: 10.5px; color: #d3bfe0; }
.hd-spot .s {
  position: absolute; top: -6px; right: -4px; min-width: 20px; height: 20px; padding: 0 4px;
  border-radius: 999px; display: grid; place-items: center;
  font-family: "IBM Plex Mono"; font-size: 10.5px; font-weight: 700;
  background: linear-gradient(180deg, #ffe9a8, var(--hdg) 60%, #a9853b); color: #2a1d00;
  border: 1px solid #7d6122; box-shadow: 0 2px 5px -1px rgba(0,0,0,.7);
}
.hd-spot .mini-die { --ds: 22px; margin-bottom: 1px; }

/* ---- chips, actions, slip ------------------------------------------------ */
.hd-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hd-chip {
  min-width: 42px; min-height: 42px; padding: 0 10px; border-radius: 999px; cursor: pointer;
  font-family: "IBM Plex Mono"; font-weight: 700; font-size: 13px;
  background: radial-gradient(circle at 34% 26%, #4d1a66, #2a0a38 70%); color: #ecdcf4;
  border: 2px dashed rgba(240,212,138,.4);
}
.hd-chip[aria-pressed="true"] {
  background: radial-gradient(circle at 34% 26%, #ffe9a8, var(--hdg) 62%, #a9853b);
  color: #2a1d00; border-style: solid; border-color: #fff; box-shadow: 0 0 12px -2px var(--hdg);
}
.hd-btn {
  min-height: 42px; padding: 9px 14px; border-radius: 9px; cursor: pointer; font-size: 12.5px; font-weight: 600;
  background: rgba(240,212,138,.1); border: 1px solid var(--hdg-line); color: #f2e6c8;
}
.hd-btn:hover:not([aria-disabled="true"]) { background: rgba(240,212,138,.2); border-color: var(--hdg); }
.hd-btn[aria-pressed="true"] { background: linear-gradient(180deg, #ffe9a8, var(--hdg) 60%, #a9853b); color: #2a1d00; border-color: #fff; }
.hd-btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
@media (pointer: coarse) { .hd-chip, .hd-btn { min-height: 44px; min-width: 44px; } }
.hd-roll {
  width: 100%; min-height: 54px; padding: 14px; border-radius: 999px; cursor: pointer;
  font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 16px; letter-spacing: .14em; text-transform: uppercase;
  background: linear-gradient(180deg, #ffeec0, var(--hdg) 52%, #9c7a2e); border: 1px solid #7d6122; color: #2a1800;
  box-shadow: 0 8px 22px -10px rgba(240,212,138,.8);
}
.hd-roll:hover:not([aria-disabled="true"]) { filter: brightness(1.08); }
.hd-roll[aria-disabled="true"] { opacity: .5; cursor: not-allowed; box-shadow: none; }
.hd-slip { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: #e0d1ea; }
.hd-slip .cost-line.total { border-top-color: var(--hdg-line); color: #fff; }
.hd-note { font-size: 11.5px; line-height: 1.5; color: #cbb8d6; margin: 0; }
.hd-link { background: none; border: none; padding: 7px 2px; min-height: 38px; color: #f2e6c8; font-size: 11.5px; text-decoration: underline; cursor: pointer; }
@media (pointer: coarse) { .hd-link { min-height: 44px; } }

/* ============================================================================
   LOBBY  (neon game-select — art: Desktop/ng_lobby.png)
   Each card carries a still from its own game, so the lobby is a window onto
   the three tables rather than four text boxes. The neon accent per card is
   that game's own: Keno gold, Just 6 violet, Hot Dice orchid.
   ========================================================================== */
.lobby {
  position: relative; border-radius: 18px; overflow: hidden;
  padding: clamp(30px, 5.5vw, 64px) clamp(14px, 4vw, 52px) clamp(34px, 6vw, 64px);
  background: #05060e;
  border: 1px solid #2a1e52;
}
.lobby::before {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background-image: var(--lobby-bg); background-size: cover; background-position: center;
  opacity: .92;
}
/* Two washes rather than one: a warm top glow to lift the wordmark off the
   backdrop, and a floor darkening so the cards always sit on something dark
   enough to read against, whatever the photograph is doing behind them. */
.lobby::after {
  content: ""; position: absolute; inset: 0; z-index: 1;
  background:
    radial-gradient(90% 55% at 50% 0%, rgba(124,77,255,.4), transparent 62%),
    radial-gradient(120% 90% at 50% 18%, transparent 28%, rgba(5,6,14,.72) 80%);
}
.lobby > * { position: relative; z-index: 2; }
.lobby-title {
  text-align: center; font-family: "Bricolage Grotesque"; font-weight: 800;
  font-size: clamp(32px, 6.4vw, 62px); letter-spacing: -0.02em; margin: 0; line-height: 1.02;
  background: linear-gradient(96deg, #8ce7ff, #fff 26%, #f5c451 52%, #fff 74%, #d77bff);
  background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 16px rgba(80,190,255,.5)) drop-shadow(0 0 34px rgba(210,70,240,.35));
  animation: lobbySheen 9s ease-in-out infinite alternate;
}
@keyframes lobbySheen { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
@media (prefers-reduced-motion: reduce) { .lobby-title { animation: none; } }
.lobby-sub {
  text-align: center; margin: 10px 0 clamp(24px, 4vw, 42px); color: #cfd8f7;
  font-size: 12.5px; letter-spacing: .2em; text-transform: uppercase;
}

.lobby-grid {
  display: grid; gap: clamp(14px, 2.2vw, 20px);
  grid-template-columns: 1fr; max-width: 960px; margin: 0 auto;
}
@media (min-width: 700px) {
  .lobby-grid { grid-template-columns: 1fr 1fr; }
  .lobby-card.feature { grid-column: 1 / -1; }
  /* Capped rather than given a ratio: spanning two columns at 16/9 made the
     featured card so tall it pushed the other games below the fold, which is
     the one thing a game-select screen must not do. */
  .lobby-card.feature .shot { aspect-ratio: auto; height: clamp(160px, 19vw, 250px); }
}

.lobby-card {
  --nc: #f5c451;
  position: relative; display: flex; flex-direction: column; text-align: left;
  padding: 0; border-radius: 15px; cursor: pointer; overflow: hidden;
  background: linear-gradient(165deg, rgba(24,28,60,.94), rgba(9,11,28,.96));
  border: 1.5px solid color-mix(in srgb, var(--nc) 55%, transparent);
  box-shadow: 0 0 20px -8px var(--nc), inset 0 0 22px -14px var(--nc);
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.lobby-card:nth-child(2) { --nc: #a259ff; }
.lobby-card:nth-child(3) { --nc: #e05bd8; }
.lobby-card:nth-child(4) { --nc: #59d9a0; }
.lobby-card:hover:not([aria-disabled="true"]),
.lobby-card:focus-visible {
  transform: translateY(-4px);
  border-color: var(--nc);
  box-shadow: 0 0 40px -6px var(--nc), inset 0 0 30px -14px var(--nc);
}
@media (prefers-reduced-motion: reduce) { .lobby-card { transition: none; } .lobby-card:hover { transform: none; } }

/* the still from the game itself */
.lobby-card .shot {
  position: relative; aspect-ratio: 3 / 2; overflow: hidden;
  background: #0a0c1e center / cover no-repeat var(--shot);
}
.lobby-card .shot::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 38%, rgba(9,11,28,.72) 78%, rgba(9,11,28,.96));
}
.lobby-card:hover:not([aria-disabled="true"]) .shot { filter: saturate(1.12) brightness(1.06); }

.lobby-card .body { padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 6px; margin-top: -34px; position: relative; }
.lobby-card .name {
  font-family: "Bricolage Grotesque"; font-weight: 800; font-size: clamp(21px, 3vw, 29px);
  letter-spacing: .01em; color: #fff; line-height: 1.05;
  text-shadow: 0 0 16px var(--nc), 0 2px 10px rgba(0,0,0,.9);
}
.lobby-card .desc { color: #c3cbe8; font-size: 12.5px; line-height: 1.45; }
.lobby-card .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
.lobby-card .meta {
  font-family: "IBM Plex Mono"; font-size: 11px; color: #0d1022; font-weight: 600;
  background: var(--nc); border-radius: 999px; padding: 3px 9px;
}
.lobby-card .arrow {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-size: 15px; color: #0d1022; background: var(--nc);
  box-shadow: 0 0 14px -2px var(--nc); transition: transform .16s ease;
}
.lobby-card:hover:not([aria-disabled="true"]) .arrow { transform: translateX(4px); }

/* Not disabled — aria-disabled, so it can still be reached and it can still
   say why. A control a keyboard cannot land on cannot explain itself. */
.lobby-card[aria-disabled="true"] { --nc: #808cba; cursor: not-allowed; box-shadow: none; }
.lobby-card[aria-disabled="true"] .shot { filter: grayscale(.85) brightness(.5); }
.lobby-card[aria-disabled="true"] .name { text-shadow: none; color: #c6cce4; }

.game-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.game-back {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.game-back:hover { border-color: var(--ink-dim); color: var(--ink); }
</style>

const store = {
  _data: null,
  load() {
    if (this._data) return this._data;
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) { this._data = JSON.parse(raw); return this._data; }
    } catch (e) { /* private mode / disabled storage — fall through to seed */ }
    this._data = seedData();
    this.save();
    return this._data;
  },
  save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this._data)); }
    catch (e) { /* storage unavailable — in-memory only for this session */ }
  },
  reset() {
    this._data = seedData();
    this.save();
  },
  /** All writes funnel through here so a real adapter has one transaction seam. */
  tx(mutator) {
    const d = this.load();
    mutator(d);
    this.save();
    return d;
  },
  get() { return this.load(); },
};

// instead of rounding them away — nice() alone would show both as the same integer.
const fmtMult = (n) => Number.isInteger(n) ? nice(n) : n.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

    { id: uid("agt"), userId: agent2.id, kind: "agent",  commissionRate: 4,  parentAgentId: master.id, createdAt: t },

  // link parentAgentId chains via agent records

  agents[2].parentAgentId = agents[1].id;
  agents[3].parentAgentId = agents[1].id;

  const games = [
    {
      id: "keno", name: "Keno", kind: "instant", enabled: true,

      config: {

      },

    {
      id: "just6", name: "Just 6", kind: "instant", enabled: true,
      blurb: "Find 6 of 48 in a 35-ball draw. The faster your six land, the bigger the multiplier. Pick 7–8 for a system bet, plus speciality bets on the first five balls.",
      config: {
        pool: 48, draw: 35, preNumbers: 5, minPick: 6, maxPick: 8,
        minStake: 1, maxStake: 50, maxWin: 1000000,
        // Bonus symbol is built but hidden/disabled for now (operator may switch it on later) —
        // flip `enabled` to true to bring it back; nothing else needs to change.
        bonus: { enabled: false, from: 6, to: 35, multiplier: 2 },
        paytable: JUST6_PAYTABLE(),

      id: "hotdice", name: "Hot Dice", kind: "instant", enabled: true,

      config: {

        minStake: 1, maxStake: 50, maxWin: 100000,

      },
    },
