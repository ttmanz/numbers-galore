  const data = { users, agents, games, rounds: [], transactions: [], meta: { createdAt: t } };

  // A few historic rounds + ledger so consoles aren't empty on first open.
  seedHistory(data, ava,  "keno", 14);
  seedHistory(data, priya, "keno", 9);
  seedHistory(data, ava,   "just6", 7);
  seedHistory(data, priya, "just6", 5);
  seedHistory(data, nico,  "hotdice", 8);
  seedHistory(data, priya, "hotdice", 5);
  // opening allocations down the chain (reporting realism)
  ledger(data, superA.id, "topup",      42000, "Float issued by operator");
  ledger(data, master.id, "allocation", 18500, "Allocated by Dana Whitlock");
  ledger(data, agent1.id, "allocation", 6200,  "Allocated by Marco Reyes");
  ledger(data, agent2.id, "allocation", 3100,  "Allocated by Marco Reyes");
  return data;
}

function ledger(data, userId, type, amount, note, extra = {}) {
  const u = data.users.find((x) => x.id === userId);
  const balanceAfter = u ? u.points : 0;
  const entry = { id: uid("tx"), userId, type, amount, balanceAfter, note, ts: now(), ...extra };
  data.transactions.push(entry);
  return entry;
}

function seedHistory(data, user, gameId, count) {
  const game = data.games.find((g) => g.id === gameId);
  for (let i = 0; i < count; i++) {
    let stake = [2, 5, 5, 10, 20][Math.floor(Math.random() * 5)];
    let selection = [], drawn = [], hits = [], multiplier = 0, win = null, extra = {};
    if (gameId === "keno") {
      const picks = 2 + Math.floor(Math.random() * 5);
      selection = pickRandom(range(1, 80), picks);
      drawn = pickRandom(range(1, 80), 20);
      hits = selection.filter((n) => drawn.includes(n));
      multiplier = game.config.paytable[picks]?.[hits.length] || 0;
    } else if (gameId === "just6") {
      selection = pickRandom(range(1, 48), 6);
      drawn = pickRandom(range(1, 48), 35);
      hits = selection.filter((n) => drawn.includes(n));
      const close = just6ClosePosition(selection, drawn);
      multiplier = close ? (game.config.paytable[close] || 0) : 0;
    } else if (gameId === "hotdice") {
      const dice = [1, 2, 3].map(() => 1 + Math.floor(Math.random() * 6));
      const total = dice.reduce((a, b) => a + b, 0);
      const side = { [total + [-2, -1, 0, 0, 1][Math.floor(Math.random() * 5)]]: 5, [Math.random() < 0.5 ? "small" : "big"]: 5 };
      const bets = Object.entries(side).map(([k, s]) => {
        const m = hotDiceSettleSpot(k, dice, game.config); return { key: k, label: hotDiceSpotLabel(k), stake: s, mult: m, win: Math.floor(s * m), won: m > 0 };
      });
      drawn = dice;
      stake = bets.reduce((a, b) => a + b.stake, 0);
      win = bets.reduce((a, b) => a + b.win, 0);
      extra = { breakdown: { dice, total, bets }, side, detail: `rolled ${dice.join("-")} = ${total}` };
    }
    if (win == null) win = Math.floor(stake * multiplier);
    const ts = now() - (count - i) * 1000 * 60 * (3 + Math.random() * 20);
    data.rounds.push({
      id: uid("rnd"), gameId, userId: user.id, selection, drawn, hits,
      stake, multiplier, win, serverSeed: "seed_" + Math.random().toString(16).slice(2, 12),
      seedHash: "…", nonce: i, ts, ...extra,
    });
    data.transactions.push({ id: uid("tx"), userId: user.id, gameId, roundId: null, type: "bet", amount: -stake, balanceAfter: user.points, note: `${game.name} stake`, ts });
    if (win > 0) data.transactions.push({ id: uid("tx"), userId: user.id, gameId, type: "win", amount: win, balanceAfter: user.points, note: `${game.name} win`, ts: ts + 500 });
  }
}

/* ---------------------------------------------------------------------------
   3. KENO PAYTABLE  (from the game spec)
   paytable[picks][hits] = total return multiple of stake.
   ------------------------------------------------------------------------- */
function KENO_PAYTABLE() {
  return {
    1: { 1: 2.5 },
    2: { 2: 7,    1: 1 },
    3: { 3: 25,   2: 3 },
    4: { 4: 80,   3: 8,   2: 1 },
    5: { 5: 500,  4: 15,  3: 3 },
    6: { 6: 1500, 5: 50,  4: 7,  3: 1 },
    7: { 7: 5000, 6: 100, 5: 20, 4: 3, 3: 1 },
    8: { 8: 15000,7: 1000,6: 50, 5: 10, 4: 2 },
  };
}

/* ---------------------------------------------------------------------------
   3b. JUST6  (game 2 — spec: Desktop/JUST6-game2.docx)
   Find 6 of 48 in a 35-ball draw. The multiplier is set by the draw position
   where your LAST matching number lands (positions 6–35). Positions 1–5 are
   "pre-numbers": no main value, they drive the speciality bets.
   ------------------------------------------------------------------------- */
function JUST6_PAYTABLE() {
  // position (6..35) -> multiple of stake — revised paytable (Desktop/JUST6_animation.png), 2026-09-11
  return {
    6: 10000, 7: 7500, 8: 5000, 9: 2000, 10: 1000, 11: 500, 12: 250, 13: 200,
    14: 100, 15: 50, 16: 40, 17: 30, 18: 20, 19: 15, 20: 14, 21: 13, 22: 12,
    23: 11, 24: 10, 25: 9, 26: 8, 27: 7, 28: 6, 29: 5, 30: 4, 31: 3, 32: 2.5,
    33: 2, 34: 1.5, 35: 1,
  };
}
// 8 colours, cycling every 8 numbers (48 / 8 = 6 each) — e.g. red = 1,9,17,25,33,41.
// Order + hex sampled from Desktop/JUST6_betting.png's colour-bet swatches.
const JUST6_COLOURS = ["red", "green", "blue", "purple", "brown", "yellow", "orange", "gray"];
const JUST6_HEX = { red: "#dd1f1f", green: "#1cc51c", blue: "#0087ff", purple: "#a82def", brown: "#844e14", yellow: "#efc82d", orange: "#cb5b00", gray: "#9a9a9a" };
// Ring + number colour flips dark/light for contrast against the ball's own
// fill — the two light colours (yellow, orange) get a dark number, everything
// else gets white. Matches the reference video exactly.
const just6TextColour = (colour) => (colour === "yellow" || colour === "orange" ? "#1b1204" : "#ffffff");
const just6Colour = (n) => JUST6_COLOURS[(n - 1) % 8];
// System-bet line count: C(picks, 6)  →  6:1  7:7  8:28
function combinations(arr, k) {
  const out = [];
  const rec = (start, combo) => {
    if (combo.length === k) { out.push(combo.slice()); return; }
    for (let i = start; i < arr.length; i++) { combo.push(arr[i]); rec(i + 1, combo); combo.pop(); }
  };
  rec(0, []);
  return out;
}
// The 1-based draw position at which the last number of `combo` is drawn,
// or null if any is not in the 35-ball draw.
function just6ClosePosition(combo, drawn) {
  let last = 0;
  for (const n of combo) {
    const idx = drawn.indexOf(n);
    if (idx === -1) return null;
    if (idx + 1 > last) last = idx + 1;
  }
  return last;
}
// The five speciality bets, all evaluated off the pre-numbers (first 5 drawn).
const JUST6_SPECIALITIES = {
  sum_parity:   { label: "Sum of 5 — odd / even",     options: ["odd", "even"],   pay: 1.8, resolve: (p) => (p.reduce((a, b) => a + b, 0) % 2 ? "odd" : "even") },
  first_parity: { label: "First ball — odd / even",   options: ["odd", "even"],   pay: 1.8, resolve: (p) => (p[0] % 2 ? "odd" : "even") },
  sum_ou:       { label: "Sum of 5 — over / under 122.5", options: ["under", "over"], pay: 1.8, resolve: (p) => (p.reduce((a, b) => a + b, 0) > 122.5 ? "over" : "under") },
  first_ou:     { label: "First ball — over / under 24.5", options: ["under", "over"], pay: 1.8, resolve: (p) => (p[0] > 24.5 ? "over" : "under") },
  colour:       { label: "First ball colour",         options: JUST6_COLOURS,     pay: 4.5, resolve: (p) => just6Colour(p[0]) },
};

/* ---------------------------------------------------------------------------
   3c. HOT DICE  (game 4 — spec: Desktop/Hot Dice.docx)
   Three dice, bet the total 3–18 (16 spots), plus Small/Big, Odd/Even and the
   six Hard Ways (an exact triple 3×N). Simplified Sic Bo.
   ------------------------------------------------------------------------- */
function HOTDICE_ODDS() {
  // total -> total-return multiple of stake
  return {
    3: 150, 4: 50, 5: 25, 6: 15, 7: 10, 8: 7, 9: 6, 10: 5,
    11: 5, 12: 6, 13: 7, 14: 10, 15: 15, 16: 25, 17: 50, 18: 150,
  };
}
// Number of ways to roll each total on 3d6 (out of 216) — for exact RTP.
function hotDiceWays() {
  const w = {};
  for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) for (let c = 1; c <= 6; c++) {
    const s = a + b + c; w[s] = (w[s] || 0) + 1;
  }
  return w;
}
function hotDiceRTP(cfg) {
  const ways = hotDiceWays();
  const rows = [];
  for (let s = 3; s <= 18; s++) rows.push({ bet: String(s), prob: ways[s] / 216, pay: cfg.odds[s], rtp: (ways[s] / 216) * cfg.odds[s] });
  const smallWays = range(3, 10).reduce((a, s) => a + ways[s], 0);
  rows.push({ bet: "small", prob: smallWays / 216, pay: cfg.evenMoney, rtp: (smallWays / 216) * cfg.evenMoney });
  rows.push({ bet: "big", prob: (216 - smallWays) / 216, pay: cfg.evenMoney, rtp: ((216 - smallWays) / 216) * cfg.evenMoney });
  const oddWays = [3, 5, 7, 9, 11, 13, 15, 17].reduce((a, s) => a + ways[s], 0);
  rows.push({ bet: "odd", prob: oddWays / 216, pay: cfg.evenMoney, rtp: (oddWays / 216) * cfg.evenMoney });
  rows.push({ bet: "even", prob: (216 - oddWays) / 216, pay: cfg.evenMoney, rtp: ((216 - oddWays) / 216) * cfg.evenMoney });
  rows.push({ bet: "hard N", prob: 1 / 216, pay: cfg.hardWay, rtp: (1 / 216) * cfg.hardWay });
  return rows;
}
// A Hot Dice bet slip is a flat map { spotKey: stake }. Keys:
//   "3".."18"  totals  ·  "small" "big" "odd" "even"  ·  "hard1".."hard6"
const HOTDICE_SPOTS = [
  ...range(3, 18).map(String),
  "small", "big", "odd", "even",
  ...range(1, 6).map((n) => "hard" + n),
];
function hotDiceSettleSpot(key, dice, cfg) {
  const total = dice[0] + dice[1] + dice[2];
  const isTriple = dice[0] === dice[1] && dice[1] === dice[2];
  const voidsEven = cfg.triplesLoseEvenMoney && isTriple;
  if (/^\d+$/.test(key)) return total === +key ? cfg.odds[key] : 0;
  if (key === "small") return !voidsEven && total >= 3 && total <= 10 ? cfg.evenMoney : 0;
  if (key === "big")   return !voidsEven && total >= 11 && total <= 18 ? cfg.evenMoney : 0;
  if (key === "odd")   return !voidsEven && total % 2 === 1 ? cfg.evenMoney : 0;
  if (key === "even")  return !voidsEven && total % 2 === 0 ? cfg.evenMoney : 0;
  const hm = key.match(/^hard([1-6])$/);
  if (hm) return isTriple && dice[0] === +hm[1] ? cfg.hardWay : 0;
  return 0;
}
const hotDiceSpotLabel = (k) => ({ small: "Small 3–10", big: "Big 11–18", odd: "Odd", even: "Even" }[k]
  || (k.startsWith("hard") ? `Hard ${k.slice(4)} (${k.slice(4)}·${k.slice(4)}·${k.slice(4)})` : `Total ${k}`));

/* ---------------------------------------------------------------------------
   4. RNG — provably fair
   commit:  seedHash = SHA-256(serverSeed) shown before the round
   reveal:  serverSeed shown after; draw is deterministic from it
   ------------------------------------------------------------------------- */
const rng = {
  newSeed() {
    const b = new Uint8Array(32);
    (crypto || window.crypto).getRandomValues(b);
    return [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
  },
  async hash(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map((x) => x.toString(16).padStart(2, "0")).join("");
  },
  /** Deterministic distinct draw of `count` integers in [1, max] from a seed,
      in genuine random DRAW ORDER (do not sort — Just 6's whole paytable is
      keyed on which position a ball lands in; Keno doesn't care about order
      either way, so this is safe for both). */
  async draw(seedHex, nonce, count, max) {
    // build a byte stream: SHA-256(seed:nonce:block) for block = 0,1,2,…
    let bytes = [], block = 0;
    const need = count * 4;
    while (bytes.length < need + 64) {
      const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(`${seedHex}:${nonce}:${block++}`));
      bytes.push(...new Uint8Array(h));
    }
    const pool = range(1, max);
    const out = [];
    let bi = 0;
    for (let i = 0; i < count; i++) {
      const r = ((bytes[bi] << 24) | (bytes[bi + 1] << 16) | (bytes[bi + 2] << 8) | bytes[bi + 3]) >>> 0;
      bi += 4;
      const j = i + (r % (pool.length - i));
      [pool[i], pool[j]] = [pool[j], pool[i]];
      out.push(pool[i]);
    }
    return out;
  },
  /** Deterministic independent rolls (repeats allowed) — e.g. dice. */
  async roll(seedHex, nonce, count, sides) {
    let bytes = [], block = 0;
    while (bytes.length < count * 4 + 8) {
      const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(`${seedHex}:${nonce}:r${block++}`));
      bytes.push(...new Uint8Array(h));
    }
    const out = [];
    for (let i = 0; i < count; i++) {
      const r = ((bytes[i * 4] << 24) | (bytes[i * 4 + 1] << 16) | (bytes[i * 4 + 2] << 8) | bytes[i * 4 + 3]) >>> 0;
      out.push((r % sides) + 1);
    }
    return out;
  },
};

/* ---------------------------------------------------------------------------
   5. WALLET — atomic debit/credit + ledger entry. Mirrors the Bingo backend:
   points are the single wallet, every movement writes a transaction row.
   ------------------------------------------------------------------------- */
const wallet = {
  balance(userId) {
    return store.get().users.find((u) => u.id === userId)?.points ?? 0;
  },
  /** Post a signed amount. Throws on insufficient funds. Returns the tx row. */
  post(userId, type, amount, note, extra = {}) {
    let entry;
    store.tx((d) => {
      const u = d.users.find((x) => x.id === userId);
      if (!u) throw new Error("Account not found");
      if (u.points + amount < 0) throw new Error(`Insufficient points — need ${nice(-amount)}, have ${nice(u.points)}`);
      u.points += amount;
      entry = { id: uid("tx"), userId, type, amount, balanceAfter: u.points, note, ts: now(), ...extra };
      d.transactions.push(entry);
    });
    return entry;
  },
  /** Move points between two accounts in one transaction (allocation / recall). */
  transfer(fromId, toId, amount, typeOut, typeIn, note) {
    store.tx((d) => {
      const a = d.users.find((x) => x.id === fromId);
      const b = d.users.find((x) => x.id === toId);
      if (!a || !b) throw new Error("Account not found");
      if (a.points < amount) throw new Error(`Insufficient points — ${a.name} has ${nice(a.points)}`);
      a.points -= amount; b.points += amount;
      d.transactions.push({ id: uid("tx"), userId: fromId, type: typeOut, amount: -amount, balanceAfter: a.points, note, ts: now() });
      d.transactions.push({ id: uid("tx"), userId: toId,   type: typeIn,  amount:  amount, balanceAfter: b.points, note, ts: now() });
    });
  },
};

/* ---------------------------------------------------------------------------
   6. AGENT HIERARCHY  (super → master → agent → player) — cloned from Bingo.
   ------------------------------------------------------------------------- */
const KIND_CHILD = { super: "master", master: "agent", agent: "player" };
const KIND_LABEL = { super: "Super agent", master: "Master agent", agent: "Agent", player: "Player", admin: "Operator" };

const agents = {
  record(userId) { return store.get().agents.find((a) => a.userId === userId); },
  forUser(userId) { return store.get().users.find((u) => u.id === userId); },

  /** Direct downline of an agent user: sub-agents + directly-recruited players. */
  downline(agentUserId) {
    const d = store.get();
    const rec = d.agents.find((a) => a.userId === agentUserId);
    const subAgents = rec ? d.agents.filter((a) => a.parentAgentId === rec.id) : [];
    const players = d.users.filter((u) => u.role === "player" && u.agentId === agentUserId);
    return {
      subAgents: subAgents.map((a) => ({ ...a, user: d.users.find((u) => u.id === a.userId) })),
      players,
    };
  },

  /** Whole tree from the top for the admin console. */
  tree() {
    const d = store.get();
    const byId = {};
    d.agents.forEach((a) => (byId[a.id] = { ...a, user: d.users.find((u) => u.id === a.userId), children: [], playerCount: 0 }));
    const roots = [];
    d.agents.forEach((a) => {
      byId[a.id].playerCount = d.users.filter((u) => u.role === "player" && u.agentId === a.userId).length;
      if (a.parentAgentId && byId[a.parentAgentId]) byId[a.parentAgentId].children.push(byId[a.id]);
      else roots.push(byId[a.id]);
    });
    return roots;
  },

  /** Create a child account under `parentUserId`, optionally seeding points. */
  create(parentUserId, { name, email, password, commissionRate = 4, points = 0 }) {
    const d0 = store.get();
    const parentUser = d0.users.find((u) => u.id === parentUserId);
    if (!parentUser) throw new Error("Parent not found");
    const childKind = KIND_CHILD[parentUser.role];
    if (!childKind) throw new Error("This role cannot create sub-accounts");
    if (!name) throw new Error("Name is required");
    if (email && d0.users.some((u) => u.email === email.toLowerCase().trim())) throw new Error("Email already in use");
    if (points > 0 && parentUser.points < points) throw new Error(`Only ${nice(parentUser.points)} points available to allocate`);

    let newUser;
    store.tx((d) => {
      const p = d.users.find((u) => u.id === parentUserId);
      newUser = {
        id: uid("usr"), name: name.trim(),
        email: email ? email.toLowerCase().trim() : null,
        password: password || null,
        role: childKind, points: 0,
        agentId: parentUserId, status: "active", createdAt: now(),
      };
      d.users.push(newUser);
      if (childKind !== "player") {
        const parentRec = d.agents.find((a) => a.userId === parentUserId);
        d.agents.push({
          id: uid("agt"), userId: newUser.id, kind: childKind,
          commissionRate: Number(commissionRate) || 4,
          parentAgentId: parentRec ? parentRec.id : null, createdAt: now(),
        });
      }
      if (points > 0) {
        p.points -= points; newUser.points += points;
        d.transactions.push({ id: uid("tx"), userId: p.id, type: "allocation", amount: -points, balanceAfter: p.points, note: `Allocated to ${newUser.name}`, ts: now() });
        d.transactions.push({ id: uid("tx"), userId: newUser.id, type: "allocation", amount: points, balanceAfter: newUser.points, note: `Received from ${p.name}`, ts: now() });
      }
    });
    return newUser;
  },
};

/* ---------------------------------------------------------------------------
   7. GAME ENGINE + MODULES
   A game module implements: { id, kind, validate(sel,stake,cfg),
   settle(sel,stake,cfg,drawFn) → { drawn, hits, multiplier, win, detail } }
   The engine owns the wallet movements and the round/ledger writes so every
   game settles identically.
   ------------------------------------------------------------------------- */
const modules = {
  keno: {
    id: "keno", kind: "instant",
    validate(sel, stake, cfg) {
      if (!Array.isArray(sel) || sel.length < cfg.minPick || sel.length > cfg.maxPick)
        return `Pick between ${cfg.minPick} and ${cfg.maxPick} numbers`;
      if (new Set(sel).size !== sel.length) return "Duplicate numbers";
      if (sel.some((n) => n < 1 || n > cfg.pool)) return "Number out of range";
      if (stake < cfg.minStake || stake > cfg.maxStake) return `Stake must be ${cfg.minStake}–${cfg.maxStake}`;
      return null;
    },
    async settle(sel, stake, cfg, drawFn) {
      const drawn = await drawFn(cfg.draw, cfg.pool);
      const hits = sel.filter((n) => drawn.includes(n));
      const multiplier = cfg.paytable[sel.length]?.[hits.length] || 0;
      const win = Math.min(Math.floor(stake * multiplier), cfg.maxWin);
      return { drawn, hits, multiplier, win, detail: `${hits.length}/${sel.length} matched` };
    },
  },

  /* ---- JUST 6 -------------------------------------------------------------
     bet shape:
       selection : number[]   (0, or 6–8 numbers) — main / system bet
       stake     : number     base stake, charged once per line
       side      : { <specialityKey>: { pick, stake } }   optional side bets
     A player may bet main-only, side-only, or both.
     -------------------------------------------------------------------- */
  just6: {
    id: "just6", kind: "instant",
    lines(sel) { return sel.length >= 6 ? combinations(sel, 6).length : 0; },
    cost(sel, stake, cfg, side) {
      let c = this.lines(sel) * stake;
      for (const b of Object.values(side || {})) c += Number(b.stake) || 0;
      return c;
    },
    validate(sel, stake, cfg, side) {
      const hasMain = Array.isArray(sel) && sel.length > 0;
      const sideKeys = Object.keys(side || {});
      if (!hasMain && !sideKeys.length) return "Pick 6–8 numbers or place a speciality bet";
      if (hasMain) {
        if (sel.length < cfg.minPick || sel.length > cfg.maxPick) return `Main bet is ${cfg.minPick}–${cfg.maxPick} numbers`;
        if (new Set(sel).size !== sel.length) return "Duplicate numbers";
        if (sel.some((n) => n < 1 || n > cfg.pool)) return "Number out of range";
        if (stake < cfg.minStake || stake > cfg.maxStake) return `Stake per line must be ${cfg.minStake}–${cfg.maxStake}`;
      }
      for (const k of sideKeys) {
        const spec = JUST6_SPECIALITIES[k];
        if (!spec) return "Unknown speciality bet";
        if (!spec.options.includes(side[k].pick)) return `Choose an option for "${spec.label}"`;
        const s = Number(side[k].stake) || 0;
        if (s < cfg.minStake || s > cfg.maxStake) return `Speciality stake must be ${cfg.minStake}–${cfg.maxStake}`;
      }
      return null;
    },
    async settle(sel, stake, cfg, drawFn, side, bonusFn) {
      const drawn = await drawFn(cfg.draw, cfg.pool);       // 35 distinct of 48
      const pre = drawn.slice(0, cfg.preNumbers);            // first 5 = pre-numbers
      const hits = sel.filter((n) => drawn.includes(n));

      // bonus symbol on a draw position from `from`..`to` — hidden/disabled for now (cfg.bonus.enabled)
      let bonusPos = null, bonusNumber = null, bonusHit = false;
      if (cfg.bonus.enabled) {
        const span = cfg.bonus.to - cfg.bonus.from + 1;
        bonusPos = cfg.bonus.from + (await bonusFn(1, span))[0] - 1;
        bonusNumber = drawn[bonusPos - 1];
        bonusHit = sel.includes(bonusNumber);
      }

      // main / system lines — one line per 6-number combination of the selection
      const lines = [];
      let mainWin = 0;
      if (sel.length >= 6) {
        for (const combo of combinations(sel, 6)) {
          const close = just6ClosePosition(combo, drawn);
          const mult = close ? (cfg.paytable[close] || 0) : 0;
          const w = Math.floor(stake * mult);
          lines.push({ combo, close, mult, win: w });
          mainWin += w;
        }
      }
      const mainBeforeBonus = mainWin;
      const bonusApplied = mainWin > 0 && bonusHit;
      if (bonusApplied) mainWin *= cfg.bonus.multiplier;

      // speciality bets — resolved off the pre-numbers
      const specials = [];
      let sideWin = 0;
      for (const [key, bet] of Object.entries(side || {})) {
        const spec = JUST6_SPECIALITIES[key];
        if (!spec) continue;
        const result = spec.resolve(pre);
        const won = result === bet.pick;
        const w = won ? Math.round((Number(bet.stake) || 0) * spec.pay) : 0;
        sideWin += w;
        specials.push({ key, label: spec.label, pick: bet.pick, result, won, win: w });
      }

      const win = Math.min(mainWin + sideWin, cfg.maxWin);
      const straight = sel.length === 6 ? lines[0] : null;
      const multiplier = straight ? straight.mult : null;

      let detail;
      if (sel.length >= 6) {
        const wonLines = lines.filter((l) => l.win > 0).length;
        detail = sel.length === 6
          ? (straight && straight.close ? `closed @ ${straight.close} · ${straight.mult}×` : `${hits.length}/6 — no set`)
          : `system ${sel.length} · ${wonLines}/${lines.length} lines`;
        if (bonusApplied) detail += " · bonus ×2";
      } else {
        detail = `speciality · ${specials.filter((s) => s.won).length}/${specials.length} won`;
      }

      return {
        drawn, hits, multiplier, win, detail,
        breakdown: { lines, mainBeforeBonus, mainWin, sideWin, bonusPos, bonusNumber, bonusHit, bonusApplied, pre, specials },
      };
    },
  },

  /* ---- HOT DICE ---------------------------------------------------------
     bet shape:  side = { <spotKey>: stake, ... }   (a flat bet slip)
       spotKey ∈ "3".."18" | "small" | "big" | "odd" | "even" | "hard1".."hard6"
     -------------------------------------------------------------------- */
  hotdice: {
    id: "hotdice", kind: "instant",
    cost(sel, stake, cfg, side) {
      return Object.values(side || {}).reduce((a, s) => a + (Number(s) || 0), 0);
    },
    validate(sel, stake, cfg, side) {
      const spots = Object.entries(side || {}).filter(([, s]) => Number(s) > 0);
      if (!spots.length) return "Place at least one bet";
      for (const [k, s] of spots) {
        if (!HOTDICE_SPOTS.includes(k)) return `Unknown bet spot "${k}"`;
        if (Number(s) < cfg.minStake || Number(s) > cfg.maxStake) return `Each bet must be ${cfg.minStake}–${cfg.maxStake}`;
      }
      return null;
    },
    async settle(sel, stake, cfg, drawFn, side, bonusFn, rollFn) {
      const dice = await rollFn(cfg.dice, cfg.faces);      // 3 × d6, repeats allowed
      const total = dice.reduce((a, b) => a + b, 0);
      const bets = [];
      let win = 0;
      for (const [key, stk] of Object.entries(side || {})) {
        const st = Number(stk) || 0;
        if (st <= 0) continue;
        const mult = hotDiceSettleSpot(key, dice, cfg);
        const w = Math.floor(st * mult);
        win += w;
        bets.push({ key, label: hotDiceSpotLabel(key), stake: st, mult, win: w, won: w > 0 });
      }
      win = Math.min(win, cfg.maxWin);
      const paid = bets.filter((b) => b.won).length;
      return {
        drawn: dice, hits: [], multiplier: null, win,
        detail: `rolled ${dice.join("-")} = ${total}${paid ? ` · ${paid} paid` : ""}`,
        breakdown: { dice, total, bets },
      };
    },
  },

  wheel: {
    id: "wheel", kind: "instant",
    validate(sel, stake, cfg) {
      if (!Array.isArray(sel) || sel.length !== 1 || !cfg.payouts[sel[0]]) return "Bet one colour";
      if (stake < cfg.minStake || stake > cfg.maxStake) return `Stake must be ${cfg.minStake}–${cfg.maxStake}`;
      return null;
    },
    async settle(sel, stake, cfg, drawFn) {
      const idx = (await drawFn(1, cfg.segments.length))[0] - 1;
      const landed = cfg.segments[idx];
      const hit = landed === sel[0];
      const multiplier = hit ? cfg.payouts[sel[0]] : 0;
      return { drawn: [landed], hits: hit ? sel.slice() : [], multiplier, win: Math.min(stake * multiplier, cfg.maxWin), detail: `Landed ${landed}` };
    },
  },
};

const engine = {
  game(gameId) { return store.get().games.find((g) => g.id === gameId); },
  module(gameId) { return modules[gameId]; },

  /** Full play cycle. Returns the settled round. */
  async play({ userId, gameId, selection = [], stake = 0, side = null }) {
    const game = this.game(gameId);
    if (!game) throw new Error("Unknown game");
    if (!game.enabled) throw new Error(`${game.name} is not available right now`);
    const user = store.get().users.find((u) => u.id === userId);
    if (!user) throw new Error("Account not found");
    if (user.status !== "active") throw new Error("This account is suspended");

    const mod = this.module(gameId);
    const cfg = game.config;
    const err = mod.validate(selection, stake, cfg, side);
    if (err) throw new Error(err);

    // total stake to debit — game-specific (JUST6 charges one stake per line + side bets)
    const cost = mod.cost ? mod.cost(selection, stake, cfg, side) : stake;
    if (!(cost > 0)) throw new Error("Nothing staked");
    if (wallet.balance(userId) < cost) throw new Error(`Insufficient points — need ${nice(cost)}, have ${nice(wallet.balance(userId))}`);

    // provably-fair commit
    const serverSeed = rng.newSeed();
    const seedHash = await rng.hash(serverSeed);
    const nonce = store.get().rounds.filter((r) => r.userId === userId && r.gameId === gameId).length;

    // debit stake
    wallet.post(userId, "bet", -cost, `${game.name} stake`, { gameId });

    // settle
    const drawFn = (count, max) => rng.draw(serverSeed, nonce, count, max);
    const bonusFn = (count, max) => rng.draw(serverSeed, nonce + "-x", count, max);
    const rollFn = (count, sides) => rng.roll(serverSeed, nonce, count, sides);
    const outcome = await mod.settle(selection, stake, cfg, drawFn, side, bonusFn, rollFn);

    // credit win
    if (outcome.win > 0) wallet.post(userId, "win", outcome.win, `${game.name} — ${outcome.detail}`, { gameId });

    // record round
    const round = {
      id: uid("rnd"), gameId, userId, selection, side: side || null, ...outcome,
      stake: cost, baseStake: stake, serverSeed, seedHash, nonce, ts: now(),
    };
    store.tx((d) => d.rounds.push(round));

    // tag the ledger rows with the round id
    store.tx((d) => {
      d.transactions.filter((tx) => tx.userId === userId && !tx.roundId && tx.gameId === gameId)
        .slice(-2).forEach((tx) => (tx.roundId = round.id));
    });
    return round;
  },
};

/* ---------------------------------------------------------------------------
   8. THEORETICAL RTP  (hypergeometric — shown in the paytable editor)
   ------------------------------------------------------------------------- */
function comb(n, k) {
  if (k < 0 || k > n) return 0;
  k = Math.min(k, n - k);
  let r = 1;
  for (let i = 0; i < k; i++) r = (r * (n - i)) / (i + 1);
  return r;
}
function kenoHitProb(pool, draw, pick, hits) {
  return (comb(draw, hits) * comb(pool - draw, pick - hits)) / comb(pool, pick);
}
function kenoRTP(cfg, pick) {
  let rtp = 0;
  for (let h = 0; h <= pick; h++) {
    const m = cfg.paytable[pick]?.[h] || 0;
    rtp += kenoHitProb(cfg.pool, cfg.draw, pick, h) * m;
  }
  return rtp;
}

/* JUST6 main-game RTP — no clean closed form, so Monte Carlo it.
   Returns { [picks]: rtp } for a straight 6 and systems 7 / 8 (bonus excluded —
   bonus multiplies an already-fair-priced win so it lowers the effective price,
   handled separately by the operator). */
function just6RTP(cfg, trials = 20000) {
  const out = {};
  for (const picks of [6, 7, 8]) {
    const lines = combinations(range(1, picks), 6).length;
    let staked = 0, returned = 0;
    for (let t = 0; t < trials; t++) {
      const sel = pickRandom(range(1, cfg.pool), picks);
      const drawn = pickRandom(range(1, cfg.pool), cfg.draw);
      staked += lines;
      for (const combo of combinations(sel, 6)) {
        const c = just6ClosePosition(combo, drawn);
        if (c) returned += cfg.paytable[c] || 0;
      }
    }
    out[picks] = returned / staked;
  }
  return out;
}

   10. UI
   ========================================================================= */
function pickRandom(arr, n) {
  const c = arr.slice();
  for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; }
  return c.slice(0, n).sort((a, b) => a - b);
}
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const fmtTime = (ts) => new Date(ts).toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// How many columns a grid is actually laid out in, counted off the rendered
// boxes. Parsing grid-template-columns looks equivalent but returns the
// specified value ("repeat(4, minmax(0, 1fr))") when layout has not flushed
// yet, which silently made arrow-down jump half a row.
function gridCols(grid) {
  const kids = [...grid.children].filter((c) => c.offsetParent !== null || c.getClientRects().length);
  if (!kids.length) return 1;
  const top = Math.round(kids[0].getBoundingClientRect().top);
  const n = kids.filter((c) => Math.round(c.getBoundingClientRect().top) === top).length;
  return Math.max(1, n);
}

// Say something to a screen reader without putting it on screen. Used for
// everything the game expresses visually only — balls landing, stake changes,
// what a bet now costs.
function announce(msg) {
  const n = document.getElementById("live");
  if (!n) return;
  // Toggling a trailing no-break space makes the region change even when the
  // same words repeat, without changing what is read out. Done synchronously:
  // a backgrounded tab stops painting frames, and announcements must not be
  // held hostage to that.
  n.textContent = n.textContent.endsWith(" ") ? msg : msg + " ";
}

function toast(msg, kind = "") {
  const t = el(`<div class="toast ${kind}">${esc(msg)}</div>`);
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity .3s"; setTimeout(() => t.remove(), 300); }, 2600);
}

let _modalSeq = 0;
// A real dialog: named by its own heading, Escape closes it, Tab stays inside
// it while it is open, and focus goes back to whatever opened it afterwards.
function modal({ title, bodyNodes, confirmText = "Save", onConfirm, wide }) {
  const root = document.getElementById("modal-root");
  const opener = document.activeElement;
  const id = "modal-title-" + ++_modalSeq;
  const bg = el(`<div class="modal-bg"></div>`);
  const m = el(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="${id}" ${wide ? 'style="width:min(560px,100%)"' : ""}><h3 id="${id}">${esc(title)}</h3><div class="body"></div><div class="foot"><button class="btn ghost" data-x>Cancel</button><button class="btn primary" data-ok>${esc(confirmText)}</button></div></div>`);
  const body = m.querySelector(".body");
  (Array.isArray(bodyNodes) ? bodyNodes : [bodyNodes]).forEach((n) => body.appendChild(n));
  const close = () => {
    bg.remove();
    document.removeEventListener("keydown", onKey, true);
    if (opener && document.contains(opener)) opener.focus({ preventScroll: true });
  };
  const focusables = () => [...m.querySelectorAll('a[href], button, input, select, textarea, summary, [tabindex]:not([tabindex="-1"])')]
    .filter((n) => !n.disabled && n.offsetParent !== null);
  function onKey(e) {
    if (e.key === "Escape") { e.stopPropagation(); close(); return; }
    if (e.key !== "Tab") return;
    const f = focusables();
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  document.addEventListener("keydown", onKey, true);
  bg.addEventListener("click", (e) => { if (e.target === bg) close(); });
  m.querySelector("[data-x]").onclick = close;
  m.querySelector("[data-ok]").onclick = async () => {
    try { await onConfirm(); close(); } catch (e) { toast(e.message, "bad"); }
  };
  bg.appendChild(m);
  root.appendChild(bg);
  (body.querySelector("input, select") || m.querySelector("[data-ok]")).focus();
}

function field(label, name, opts = {}) {
  const wrap = el(`<div><label class="f">${esc(label)}</label></div>`);
  const input = opts.select
    ? el(`<select class="i" name="${name}">${opts.options.map((o) => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join("")}</select>`)
    : el(`<input class="i" name="${name}" type="${opts.type || "text"}" placeholder="${esc(opts.placeholder || "")}" ${opts.value != null ? `value="${esc(opts.value)}"` : ""}>`);
  wrap.appendChild(input);
  return wrap;
}
const readForm = (container) => {
  const o = {};
  container.querySelectorAll("input, select").forEach((i) => (o[i.name] = i.value.trim()));

};

    { href: "#/account", ic: "▤", label: "My account" },
  ],
  agent: [
    { href: "#/agent", ic: "◭", label: "Downline" },
    { href: "#/agent/ledger", ic: "▤", label: "Family ledger" },
  ],
  admin: [
    { href: "#/admin", ic: "◫", label: "Dashboard" },
    { href: "#/admin/games", ic: "◈", label: "Games" },
    { href: "#/admin/agents", ic: "◭", label: "Agents" },
    { href: "#/admin/players", ic: "☺", label: "Players" },
    { href: "#/admin/rounds", ic: "◎", label: "Rounds" },
    { href: "#/admin/ledger", ic: "▤", label: "Ledger" },
  ],
};

function render() {
  const root = document.getElementById("root");
  const route = location.hash.slice(2) || "play";
  const me = store.get().users.find((u) => u.id === session.userId);
  const bal = me.role === "admin" ? null : me.points;

  root.innerHTML = "";
  const app = el(`<div class="app"></div>`);

  // rail
  const rail = el(`<nav class="rail"></nav>`);
  rail.appendChild(el(`<div class="brand"><div class="dot">NG</div><div><b>Numbers Galore</b><span>Gaming platform</span></div></div>`));
  const navList = NAV[session.role];
  if (window.innerWidth > 900) rail.appendChild(el(`<div class="nav-group">${KIND_LABEL[session.role] || session.role}</div>`));
  navList.forEach((n) => {
    const active = ("#/" + route) === n.href || (n.href !== NAV[session.role][0].href && ("#/" + route).startsWith(n.href));
    const a = el(`<a class="nav ${active ? "on" : ""}" href="${n.href}"><span class="ic">${n.ic}</span>${n.label}</a>`);
    if (n.href === "#/play") a.addEventListener("click", () => { currentGameId = null; });
    rail.appendChild(a);
  });
  rail.appendChild(el(`<div style="flex:1"></div>`));
  const resetBtn = el(`<button class="nav" style="color:var(--ink-dim)"><span class="ic">↺</span>Reset demo data</button>`);
  resetBtn.onclick = () => { store.reset(); _id = 1; kenoState = null; toast("Demo data reset", "ok"); boot(); };
  rail.appendChild(resetBtn);

  // main
  const main = el(`<div class="main"></div>`);
  const topbar = el(`<div class="topbar"></div>`);
  const ids = api.auth.identities();
  const switcher = el(`<div class="switcher"></div>`);
  [["player", ids.player], ["agent", ids.agent], ["admin", ids.admin]].forEach(([r, u]) => {
    const c = el(`<button class="chip ${session.role === r ? "on" : ""}"><span class="r">${r}</span>${esc(u.name.split(" ")[0])}</button>`);
    c.onclick = () => assume(r);
    switcher.appendChild(c);
  });
  topbar.appendChild(switcher);

  const who = el(`<div class="who"><div class="av">${esc(me.name[0])}</div><div><b>${esc(me.name)}</b><br><span>${KIND_LABEL[me.role]}${me.role === "agent" ? " · " + (agents.record(me.id)?.commissionRate ?? 0) + "% comm." : ""}</span></div></div>`);
  topbar.appendChild(who);

  if (bal != null) topbar.appendChild(el(`<div class="bal"><span class="k">Points</span><span class="v">${nice(bal)}</span></div>`));
  else topbar.appendChild(el(`<div style="margin-left:auto"></div>`));

  const themeBtn = el(`<button class="icon-btn" title="Toggle theme">◐</button>`);
  themeBtn.onclick = toggleTheme;
  topbar.appendChild(themeBtn);

  main.appendChild(topbar);
  const view = el(`<div class="view"></div>`);
  main.appendChild(view);

  app.appendChild(rail);
  app.appendChild(main);
  root.appendChild(app);

  const R = {
    "play": viewPlay, "account": viewAccount,
    "agent": viewAgent, "agent/ledger": viewAgentLedger,
    "admin": viewAdminDash, "admin/games": viewAdminGames, "admin/agents": viewAdminAgents,
    "admin/players": viewAdminPlayers, "admin/rounds": viewAdminRounds, "admin/ledger": viewAdminLedger,
  };
  (R[route] || viewPlay)(view);
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
}

function head(view, title, sub, actions) {
  const h = el(`<div class="view-head"><div><h1>${esc(title)}</h1>${sub ? `<p>${esc(sub)}</p>` : ""}</div></div>`);
  if (actions) { const sp = el(`<div class="sp"></div>`); h.appendChild(sp); (Array.isArray(actions) ? actions : [actions]).forEach((a) => h.appendChild(a)); }
  view.appendChild(h);
}

/* =========================================================================
   PLAYER — Play view (Keno + game switcher)
   ========================================================================= */
let kenoState = null;
let currentGameId = null;   // null = lobby
let soundEnabled = true;    // platform-wide sound toggle — no audio engine wired up yet, this just drives the icon

const GAME_TAGLINES = {
  keno:    "Pick up to 8 of 80 · win big",
  just6:   "Six of 48 — the faster they land, the bigger the win",
  hotdice: "Three dice · call the total",
  wheel:   "Bet a colour and spin",
};

function viewPlay(view) {
  const games = api.player.games();
  if (!games.length) { view.appendChild(el(`<div class="empty-state"><div class="em">◎</div>No games are live right now.</div>`)); return; }
  if (currentGameId && !games.some((g) => g.id === currentGameId)) currentGameId = null;

  if (!currentGameId) { viewLobby(view); return; }

  // in a game — slim switch bar
  const g0 = engine.game(currentGameId);
  const bar = el(`<div class="game-bar"></div>`);
  const back = el(`<button class="game-back">‹ All games</button>`);
  back.onclick = () => { currentGameId = null; kenoState = null; render(); };
  bar.appendChild(back);
  const tabs = el(`<div class="game-tabs" style="margin:0"></div>`);
  store.get().games.forEach((g) => {
    const b = el(`<button class="game-tab ${g.id === currentGameId ? "on" : ""}" ${g.enabled ? "" : "disabled"}>${esc(g.name)}${g.enabled ? "" : ' <span class="pill dim">soon</span>'}</button>`);
    b.onclick = () => { currentGameId = g.id; kenoState = null; render(); };
    tabs.appendChild(b);
  });
  bar.appendChild(tabs);
  view.appendChild(bar);

  if (currentGameId === "keno") viewKeno(view);
  else if (currentGameId === "just6") viewJust6(view);
  else if (currentGameId === "hotdice") viewHotDice(view);
  else viewSimpleGame(view, currentGameId);
}

function viewLobby(view) {
  const all = store.get().games;
  const me = api.player.me(session.userId);
  const lobby = el(`<div class="lobby" style="--lobby-bg:url('${LOBBY_BG}')"></div>`);
  lobby.appendChild(el(`<h1 class="lobby-title">Numbers Galore</h1>`));
  lobby.appendChild(el(`<p class="lobby-sub">${nice(me.points)} points · choose your game</p>`));

  // No list roles here: role="listitem" on a <button> overrides the button
  // role, and a screen reader would announce a list item rather than
  // something you can press. Buttons in a plain container say it themselves.
  const grid = el(`<div class="lobby-grid" role="group" aria-label="Games"></div>`);
  all.forEach((g, i) => {
    const shot = LOBBY_SHOTS[g.id];
    const stakes = `${g.config.minStake}–${g.config.maxStake} pts`;
    const tag = GAME_TAGLINES[g.id] || g.blurb;
    // aria-disabled rather than disabled: a card a keyboard cannot reach
    // cannot tell anyone why it is unavailable.
    const card = el(`<button class="lobby-card${i === 0 ? " feature" : ""}"
      data-fk="game-${g.id}" aria-disabled="${!g.enabled}"
      aria-label="${esc(g.name)}. ${esc(tag)} ${g.enabled ? stakes + " a play." : "Coming soon."}">
      <span class="shot" aria-hidden="true" ${shot ? `style="--shot:url('${shot}')"` : ""}></span>
      <span class="body">
        <span class="name">${esc(g.name)}</span>
        <span class="desc">${esc(tag)}</span>
        <span class="foot">
          <span class="meta">${g.enabled ? stakes : "Coming soon"}</span>
          <span class="arrow" aria-hidden="true">${g.enabled ? "→" : "·"}</span>
        </span>
      </span>
    </button>`);
    card.onclick = () => {
      if (!g.enabled) { toast(`${g.name} isn't open yet`, ""); return; }
      currentGameId = g.id; kenoState = null; render();
    };
    grid.appendChild(card);
  });
  lobby.appendChild(grid);
  view.appendChild(lobby);
}

function viewKeno(view) {
  const game = engine.game("keno");
  const cfg = game.config;
  const me = api.player.me(session.userId);
  if (!kenoState || kenoState.gameId !== "keno")
    kenoState = { gameId: "keno", picks: [], stake: 1, luckyN: 4, busy: false, drawing: false, skip: false, lastRound: null, focusN: 1 };
  const S = kenoState;
  const R = S.lastRound;
  const locked = S.busy || S.drawing;

  // The whole cabinet is rebuilt on every interaction, which on its own drops
  // keyboard focus back to <body> each time. Every control carries a stable
  // data-fk and the same one is restored afterwards.
  const refresh = () => {
    const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : null;
    viewPlay(clearAndReturn(view));
    if (key) {
      const next = view.querySelector(`[data-fk="${CSS.escape(key)}"]`);
      if (next) next.focus({ preventScroll: true });
    }
  };

  const cab = el(`<div class="keno-wrap keno-cab"></div>`);
  cab.setAttribute("aria-busy", locked ? "true" : "false");
  cab.appendChild(el(`<h2 class="sr-only">Keno — pick up to ${cfg.maxPick} of ${cfg.pool}</h2>`));

  /* ---- the display band: the reference art, with the live pieces on top ---- */
  const drawnList = R?.drawn || [];
  const dispWrap = el(`<div class="keno-display-wrap ${S.drawing ? "drawing" : ""}"></div>`);
  const zoom = el(`<div class="keno-display-zoom">
    <img class="keno-display-img" alt="The Keno draw sphere in a penthouse lounge, with the Draw box beside it" src="${KENO_DISPLAY_IMG}">
  </div>`);
  zoom.appendChild(kenoDrum());
  const revealCx = KENO_DRUM.x + KENO_DRUM.w / 2, revealCy = KENO_DRUM.y + KENO_DRUM.h / 2;
  zoom.appendChild(el(`<div class="keno-reveal kball" data-reveal aria-hidden="true" style="left:${revealCx}%;top:${revealCy}%"></div>`));
  dispWrap.appendChild(zoom);

  const homeBtn = el(`<button class="j6-iconbtn keno-display-icon" data-fk="home" aria-label="Leave Keno and go back to all games" style="left:${KENO_ICONS.home.x}%;top:${KENO_ICONS.home.y}%"><svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg></button>`);
  homeBtn.onclick = () => { if (locked) return; currentGameId = null; kenoState = null; render(); };
  const soundBtn = el(`<button class="j6-iconbtn keno-display-icon" data-fk="sound" aria-pressed="${soundEnabled}" aria-label="Sound" style="left:${KENO_ICONS.sound.x}%;top:${KENO_ICONS.sound.y}%">${soundEnabled ? `<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.8a9 9 0 0 1 0 12.4"/></svg>` : `<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="m16 9.5 5 5"/><path d="m21 9.5-5 5"/></svg>`}</button>`);
  soundBtn.onclick = () => { soundEnabled = !soundEnabled; announce(soundEnabled ? "Sound on" : "Sound off"); refresh(); };
  dispWrap.append(homeBtn, soundBtn);

  // The art and the draw read-out share one positioned stage: wide, the panel
  // is placed over the box the art paints; narrow, it drops out below it.
  const stage = el(`<div class="keno-stage"></div>`);
  stage.appendChild(dispWrap);

  const drawPanel = el(`<div class="keno-drawpanel" data-drawlist role="group" aria-label="Numbers drawn, in order"
    style="left:${KENO_DRAWBOX.x}%;top:${KENO_DRAWBOX.y}%;width:${KENO_DRAWBOX.w}%;height:${KENO_DRAWBOX.h}%"></div>`);
  drawPanel.appendChild(el(`<span class="kdraw-lbl">Draw</span>`));
  drawnList.forEach((n) => drawPanel.appendChild(kenoChip(n, S.picks.includes(n), false)));
  if (!drawnList.length) drawPanel.appendChild(el(`<span class="ksel-empty">Numbers appear here as they are drawn.</span>`));
  stage.appendChild(drawPanel);
  cab.appendChild(stage);

  /* ---- body: numbers, controls, paytable ---- */
  const body = el(`<div class="keno-body"></div>`);

  // numbers
  const numbers = el(`<section class="kpanel keno-numbers" aria-labelledby="k-nums-head"></section>`);
  numbers.appendChild(el(`<h3 id="k-nums-head">Select your numbers</h3>`));
  numbers.appendChild(el(`<span class="sr-only" id="k-nums-help">Up to ${cfg.maxPick} numbers. Use the arrow keys to move between them, then Space to pick one.</span>`));
  const grid = el(`<div class="keno-grid" role="group" aria-labelledby="k-nums-head" aria-describedby="k-nums-help"></div>`);
  if (!S.focusN || S.focusN < 1 || S.focusN > cfg.pool) S.focusN = S.picks[0] || 1;
  for (let n = 1; n <= cfg.pool; n++) {
    const picked = S.picks.includes(n);
    const at = R ? R.drawn.indexOf(n) : -1;
    const cls = R && picked && at >= 0 ? "hit" : R && at >= 0 ? "drawn" : "";
    const state = at >= 0 ? `, drawn` : "";
    const b = el(`<button class="spot ${cls}" data-fk="n-${n}" data-n="${n}" tabindex="${n === S.focusN ? 0 : -1}"
      aria-pressed="${picked}" aria-disabled="${locked}" aria-label="${n}${state}">${n}</button>`);
    b.addEventListener("focus", () => { S.focusN = n; });
    b.onclick = () => {
      if (locked) return;
      if (S.picks.includes(n)) S.picks = S.picks.filter((x) => x !== n);
      else {
        if (S.picks.length >= cfg.maxPick) { toast(`Up to ${cfg.maxPick} numbers`, "bad"); return; }
        S.picks.push(n);
      }
      S.luckyN = Math.max(1, S.picks.length || S.luckyN);
      S.lastRound = null;
      refresh();
      announce(kenoPickSentence(S, cfg));
    };
    grid.appendChild(b);
  }
  // One tab stop for eighty buttons; the arrows do the moving, the way a grid
  // of controls is meant to behave.
  grid.addEventListener("keydown", (e) => {
    const cols = gridCols(grid);
    const here = Number((grid.contains(document.activeElement) && document.activeElement.dataset.n) || S.focusN);
    const delta = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -cols, ArrowDown: cols }[e.key];
    let to = delta ? here + delta : e.key === "Home" ? 1 : e.key === "End" ? cfg.pool : null;
    if (to == null) return;
    e.preventDefault();
    to = Math.min(cfg.pool, Math.max(1, to));
    const next = grid.querySelector(`[data-fk="n-${to}"]`);
    if (next) { S.focusN = to; next.focus(); }
  });
  numbers.appendChild(grid);
  body.appendChild(numbers);

  /* ---- side: quick picks, what is selected, PLAY ---- */
  const side = el(`<div class="keno-side"></div>`);

  const quick = el(`<section class="kpanel" aria-labelledby="k-quick-head"></section>`);
  quick.appendChild(el(`<h3 id="k-quick-head">Quick picks</h3>`));
  const qrow = el(`<div class="kquick"></div>`);
  const qstep = el(`<div class="kstep" role="group" aria-label="How many numbers to pick at random"></div>`);
  const mkQ = (dir, label, glyph, off) => {
    const b = el(`<button data-fk="lucky-${dir > 0 ? "up" : "down"}" aria-label="${label}" aria-disabled="${off}"><span aria-hidden="true">${glyph}</span></button>`);
    b.onclick = () => {
      if (off || locked) return;
      S.luckyN = Math.min(cfg.maxPick, Math.max(1, S.luckyN + dir));
      refresh();
      announce(`${S.luckyN} random numbers`);
    };
    return b;
  };
  qstep.appendChild(mkQ(-1, "Fewer random numbers", "−", S.luckyN <= 1 || locked));
  qstep.appendChild(el(`<span class="val">${S.luckyN}<span class="sr-only"> numbers</span></span>`));
  qstep.appendChild(mkQ(1, "More random numbers", "+", S.luckyN >= cfg.maxPick || locked));
  const randBtn = el(`<button class="ksteel-btn" data-fk="random" aria-disabled="${locked}">Random</button>`);
  randBtn.onclick = () => {
    if (locked) return;
    S.picks = pickRandom(range(1, cfg.pool), S.luckyN);
    S.lastRound = null;
    refresh();
    announce(`Picked ${S.picks.slice().sort((a, b) => a - b).join(", ")}. ${kenoPickSentence(S, cfg)}`);
  };
  const clearBtn = el(`<button class="ksteel-btn" data-fk="clear" aria-disabled="${locked}">Clear</button>`);
  clearBtn.onclick = () => {
    if (locked) return;
    S.picks = []; S.lastRound = null;
    refresh();
    announce("Selection cleared.");
  };
  qrow.append(qstep, randBtn, clearBtn);
  quick.appendChild(qrow);
  side.appendChild(quick);

  const selPanel = el(`<section class="kpanel" aria-labelledby="k-sel-head"></section>`);
  selPanel.appendChild(el(`<h3 id="k-sel-head">Selected${R ? " : hit" : ""}</h3>`));
  const selRow = el(`<div class="ksel"></div>`);
  if (!S.picks.length) selRow.appendChild(el(`<span class="ksel-empty">No numbers yet — tap the board or hit Random.</span>`));
  else S.picks.slice().sort((a, b) => a - b).forEach((n) => {
    const hit = R && R.drawn.includes(n);
    selRow.appendChild(el(`<div class="kball ${R ? (hit ? "on" : "miss") : ""}" aria-label="${n}${R ? (hit ? ", hit" : ", missed") : ""}">${n}</div>`));
  });
  selPanel.appendChild(selRow);
  side.appendChild(selPanel);

  // While the machine is running this is the way out of it — twenty balls is
  // twenty seconds of movement, and nobody should be held there.
  const playBtn = S.drawing
    ? el(`<button class="keno-play skip" data-fk="play">Skip draw</button>`)
    : el(`<button class="keno-play" data-fk="play" aria-disabled="${!S.picks.length || S.busy}" aria-describedby="k-playhint">${S.busy ? "…" : "Play"}</button>`);
  playBtn.onclick = () => {
    if (S.drawing) { S.skip = true; return; }
    if (S.busy) return;
    if (!S.picks.length) { toast("Pick at least one number first", "bad"); return; }
    runKeno();
  };
  side.appendChild(playBtn);
  side.appendChild(el(`<p class="kpay-note" id="k-playhint" style="text-align:center">${esc(kenoPickSentence(S, cfg))}</p>`));
  body.appendChild(side);

  /* ---- paytable for the pick you actually hold ---- */
  const pay = el(`<section class="kpanel keno-paytable" aria-labelledby="k-pay-head"></section>`);
  pay.appendChild(el(`<h3 id="k-pay-head">Pay table</h3>`));
  const p = S.picks.length;
  if (!p) pay.appendChild(el(`<p class="kpay-note">Pick some numbers and the prizes for that many will show here.</p>`));
  else {
    const rows = el(`<div class="kpay-rows"></div>`);
    rows.appendChild(el(`<div class="kpay-head"><span>Hits</span><span style="text-align:right">Win</span></div>`));
    const hits = R ? R.hits.length : -1;
    for (let hh = p; hh >= 0; hh--) {
      const mult = cfg.paytable[p]?.[hh] || 0;
      if (!mult && hh > 0) continue;
      if (!mult && hh === 0) continue;
      rows.appendChild(el(`<div class="${hh === hits ? "row-on" : ""}" style="display:contents">
        <b>${hh}</b><span class="win">${nice(Math.floor(S.stake * mult))} pts <small style="color:var(--kdim)">(${mult}×)</small></span></div>`));
    }
    pay.appendChild(rows);
    pay.appendChild(el(`<p class="kpay-note">On ${p} number${p > 1 ? "s" : ""} at ${S.stake} point${S.stake > 1 ? "s" : ""}. Return to player ${(kenoRTP(cfg, p) * 100).toFixed(1)}%.</p>`));
  }
  const fullBtn = el(`<button class="klink" data-fk="fullpay">Full pay table</button>`);
  fullBtn.onclick = () => modal({ title: "Keno — full pay table", bodyNodes: kenoPaytableTable(cfg, false), confirmText: "Close", onConfirm() {}, wide: true });
  pay.appendChild(fullBtn);
  body.appendChild(pay);
  cab.appendChild(body);

  /* ---- status bar ---- */
  const foot = el(`<div class="keno-foot"></div>`);
  foot.appendChild(el(`<div class="kstat"><span class="lbl">Balance</span><span class="v">${nice(me.points)}</span></div>`));
  const betStat = el(`<div class="kstat"><span class="lbl" id="k-bet-lbl">Bet</span></div>`);
  const betStep = el(`<div class="kstat kstep" role="group" aria-labelledby="k-bet-lbl"></div>`);
  const stakeSteps = [1, 2, 5, 10, 20, 50, 100].filter((v) => v >= cfg.minStake && v <= cfg.maxStake);
  const si = stakeSteps.indexOf(S.stake);
  const mkBet = (dir, label, glyph, off) => {
    const b = el(`<button data-fk="bet-${dir > 0 ? "up" : "down"}" aria-label="${label}" aria-disabled="${off}"><span aria-hidden="true">${glyph}</span></button>`);
    b.onclick = () => {
      if (off || locked) return;
      const i = si < 0 ? 0 : si;
      S.stake = stakeSteps[Math.min(stakeSteps.length - 1, Math.max(0, i + dir))];
      refresh();
      announce(`Bet ${S.stake} points. ${kenoPickSentence(S, cfg)}`);
    };
    return b;
  };
  betStep.appendChild(mkBet(-1, "Lower the bet", "▼", si <= 0 || locked));
  betStep.appendChild(el(`<span class="val">${S.stake}<span class="sr-only"> points</span></span>`));
  betStep.appendChild(mkBet(1, "Raise the bet", "▲", si >= stakeSteps.length - 1 || locked));
  foot.append(betStat, betStep);
  foot.appendChild(el(`<div class="kstat"><span class="lbl">Win</span><span class="v ${R && R.win > 0 ? "win" : ""}">${R ? nice(R.win) : "—"}</span></div>`));
  foot.appendChild(el(`<div class="spacer"></div>`));
  const lastBtn = el(`<button class="klink" data-fk="last10">Last 10 draws</button>`);
  lastBtn.onclick = () => openKenoDraws();
  foot.appendChild(lastBtn);
  cab.appendChild(foot);

  view.appendChild(cab);
  // Only once it is in the document, so the drum can measure itself.
  if (S.drawing && !matchMedia("(prefers-reduced-motion: reduce)").matches) kenoDrumStart(cab.querySelector(".keno-drum-balls"));
  else kenoDrumStop();

  async function runKeno() {
    const err = modules.keno.validate(S.picks, S.stake, cfg);
    if (err) { toast(err, "bad"); return; }
    if (me.points < S.stake) { toast("Not enough points", "bad"); return; }
    S.busy = true; S.drawing = true; S.skip = false; S.lastRound = null;
    refresh();
    announce("The machine is drawing.");
    try {
      const round = await engine.play({ userId: session.userId, gameId: "keno", selection: S.picks.slice(), stake: S.stake });
      S.busy = false;
      S._pendingSeed = null;
      await animateKenoDraw(round, S, cfg);
      S.drawing = false;
      S.lastRound = round;
      render();
      const msg = round.win > 0 ? `Won ${nice(round.win)} points!` : "No win this time";
      toast(msg, round.win > 0 ? "ok" : "");
      announce(round.win > 0
        ? `Draw complete. ${round.hits.length} of ${round.selection.length} matched. You won ${nice(round.win)} points.`
        : `Draw complete. ${round.hits.length} of ${round.selection.length} matched. No win this time.`);
    } catch (e) {
      S.busy = false; S.drawing = false; render();
      toast(e.message, "bad"); announce(e.message);
    }
  }
}

// One sentence covering what is staked and what is missing — shown under Play,
// spoken on every change, and used as the Play button's description.
function kenoPickSentence(S, cfg) {
  const p = S.picks.length;
  if (!p) return `No numbers yet. Pick 1 to ${cfg.maxPick}, or use Random.`;
  const top = cfg.paytable[p]?.[p] || 0;
  return `${p} number${p > 1 ? "s" : ""} at ${S.stake} point${S.stake > 1 ? "s" : ""}. Best case ${nice(Math.floor(S.stake * top))} points for ${p} of ${p}.`;
}

// A drawn ball, as it appears in the Draw box.
function kenoChip(n, isHit, animate) {
  const chip = el(`<div class="keno-dchip ${isHit ? "hit" : ""}" ${animate ? "" : 'style="animation:none"'}>${n}</div>`);
  chip.setAttribute("aria-label", `${n}${isHit ? ", your number" : ""}`);

}

function openKenoDraws() {
  const body = el(`<div class="stack"></div>`);
  const recent = api.player.recentDraws("keno", 10);
  if (!recent.length) body.appendChild(el(`<p class="muted">No draws yet.</p>`));
  else recent.forEach((r) => body.appendChild(el(
    `<div><div class="muted" style="font-size:11px">${fmtTime(r.ts)}</div><div class="mono" style="font-size:12.5px">${r.drawn.join(" · ")}</div></div>`)));
  const mine = api.player.history(session.userId, "keno", 10);
  if (mine.length) {
    body.appendChild(el(`<hr class="sep">`));
    body.appendChild(el(`<div class="f">Your last ${mine.length} play${mine.length === 1 ? "" : "s"}</div>`));
    const strip = el(`<div class="hist-strip"></div>`);
    mine.forEach((r) => strip.appendChild(el(`<span class="hchip ${r.win > 0 ? "w" : ""}" title="${fmtTime(r.ts)} · ${r.hits.length}/${r.selection.length}">${r.win > 0 ? "+" + nice(r.win) : "−" + nice(r.stake)}</span>`)));
    body.appendChild(strip);

  modal({ title: "Keno — last 10 draws", bodyNodes: body, confirmText: "Close", onConfirm() {} });
}

// Per ball: it swells in front of the sphere, holds long enough to read, fades,
// then settles into the Draw box. The tumbler runs underneath the whole time —
// from a beat before the first ball to just after the last.
const KENO_HOLD_MS = 440, KENO_FADE_MS = 160, KENO_PREROLL_MS = 1500;

async function animateKenoDraw(round, S, cfg) {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wrap = document.querySelector(".keno-display-wrap");
  const reveal = document.querySelector("[data-reveal]");
  const drawPanel = document.querySelector(".keno-drawpanel");
  const picks = new Set(round.selection);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const waitSkippable = async (ms) => { for (let t = 0; t < ms && !S.skip; t += 80) await wait(80); };
  const markHit = (n) => {
    const spot = document.querySelector(`.keno-grid [data-n="${n}"]`);
    if (spot) { spot.classList.add("hit"); spot.setAttribute("aria-label", `${n}, drawn`); }
  };
  const land = (n) => {
    const isHit = picks.has(n);
    if (drawPanel) drawPanel.appendChild(kenoChip(n, isHit, true));
    if (isHit) markHit(n);
    announce(`${n}${isHit ? ", your number" : ""}`);
  };

  if (drawPanel) [...drawPanel.children].forEach((c) => { if (!c.classList.contains("kdraw-lbl")) c.remove(); });
  if (reduce || !wrap || !reveal) { round.drawn.forEach(land); return; }

  wrap.classList.add("drawing");
  kenoDrumStart(wrap.querySelector(".keno-drum-balls"));
  await waitSkippable(KENO_PREROLL_MS);         // balls churning, nothing drawn yet

  for (const n of round.drawn) {
    if (!S.skip) {
      reveal.textContent = n;
      reveal.className = "keno-reveal kball show";
      await wait(KENO_HOLD_MS);
      reveal.className = "keno-reveal kball show fade";
      await wait(KENO_FADE_MS);
      reveal.className = "keno-reveal kball";
    }
    land(n);
  }
  reveal.className = "keno-reveal kball";
  reveal.textContent = "";
  kenoDrumStop();
  wrap.classList.remove("drawing");
}

function clearAndReturn(view) { view.innerHTML = ""; return view; }

function resultBanner(round) {
  const win = round.win > 0;
  return el(`<div class="result ${win ? "win" : "lose"}">
    <div class="big">${win ? "+" + nice(round.win) + " points" : "No win"}</div>
    <div class="sm">${round.hits.length} of ${round.selection.length} matched${round.multiplier ? ` · ${round.multiplier}× on ${round.stake}` : ""} · <span class="mono" title="server seed">${esc((round.serverSeed || "").slice(0, 16))}…</span></div>
  </div>`);
}

function kenoPaytableTable(cfg, editable) {
  const maxHits = 8;
  const t = el(`<div style="overflow-x:auto"><table class="paytable-mini"><thead><tr><th>Pick \\ hits</th>${range(0, maxHits).map((h) => `<th>${h}</th>`).join("")}<th>RTP</th></tr></thead><tbody></tbody></table></div>`);
  const tb = t.querySelector("tbody");
  for (let p = cfg.minPick; p <= cfg.maxPick; p++) {
    const tr = el(`<tr><td>${p}</td></tr>`);
    for (let h = 0; h <= maxHits; h++) {
      const v = cfg.paytable[p]?.[h];
      if (h > p) { tr.appendChild(el(`<td style="opacity:.25">·</td>`)); continue; }
      if (editable) {
        const td = el(`<td></td>`);
        const inp = el(`<input class="editable-cell mono" value="${v ?? 0}" data-p="${p}" data-h="${h}">`);
        td.appendChild(inp); tr.appendChild(td);
      } else {
        tr.appendChild(el(`<td>${v ? v + "×" : "—"}</td>`));
      }
    }
    tr.appendChild(el(`<td class="mono" style="color:var(--violet)">${(kenoRTP(cfg, p) * 100).toFixed(1)}%</td>`));
    tb.appendChild(tr);
  }
  return t;
}

/* =========================================================================
   PLAYER — JUST 6
   ========================================================================= */

   A lottery ball, drawn the same way everywhere it appears — in a printed

function j6Ball(n, { cls = "", size = null, label = null } = {}) {

  const ball = el(`<div class="j6-ball ${cls}" style="${style}"><span>${n}</span></div>`);

function j6PaintBall(node, n) {

  node.style.setProperty("--tc", just6TextColour(colour));
