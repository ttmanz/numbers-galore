let KENO_DRUM_BALLS = null;
function kenoDrumBalls() {
  if (KENO_DRUM_BALLS) return KENO_DRUM_BALLS;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const R = J6_PHYS.R_INNER * 0.62;
  KENO_DRUM_BALLS = range(1, 24).map(() => {
    let x, y, z;
    do { x = rnd(-R, R); y = -Math.random() * R; z = rnd(-R, R); } while (x * x + y * y + z * z > R * R);
    return { n: Math.ceil(Math.random() * 80), x, y, z, size: rnd(2.6, 3.2) };
  });
  return KENO_DRUM_BALLS;
}
function kenoDrum() {
  const drum = el(`<div class="keno-drum" aria-hidden="true" style="left:${KENO_DRUM.x}%;top:${KENO_DRUM.y}%;width:${KENO_DRUM.w}%;height:${KENO_DRUM.h}%"></div>`);
  const layer = el(`<div class="keno-drum-balls"></div>`);
  kenoDrumBalls().forEach((b) => {
    const ball = el(`<div class="kball">${b.n}</div>`);
    ball.dataset.px = b.x; ball.dataset.py = b.y; ball.dataset.pz = b.z;
    const k = 100 / J6_PHYS.SIZE;
    ball.style.cssText = `--bs:${b.size}cqw;--fx:${((J6_PHYS.CENTRE + b.x) * k).toFixed(1)}%;--fy:${((J6_PHYS.CENTRE - b.y) * k).toFixed(1)}%;`;
    layer.appendChild(ball);
  });
  drum.appendChild(layer);
  return drum;
}

function viewJust6(view) {
  const game = engine.game("just6");
  const cfg = game.config;
  const me = api.player.me(session.userId);
  if (!kenoState || kenoState.gameId !== "just6")
    kenoState = { gameId: "just6", picks: [], stake: 1, busy: false, lastRound: null, side: {}, drawing: false, showResults: false };
  const S = kenoState;
  const R = S.lastRound;

  // Re-rendering the whole screen on every click is what this view does; on
  // its own that throws keyboard focus back to <body> each time. Every control
  // carries a stable data-fk, and the same one is refocused afterwards.
  const refresh = () => {
    const key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : null;
    viewJust6(clearAndReturn(view));
    if (key) {
      const next = view.querySelector(`[data-fk="${CSS.escape(key)}"]`);
      if (next) next.focus({ preventScroll: true });
    }
  };

  const lines = S.picks.length >= 6 ? combinations(S.picks, 6).length : 0;
  const sideCount = Object.keys(S.side).length;
  const totalCost = lines * S.stake + sideCount * S.stake;
  const shortOfPicks = S.picks.length > 0 && S.picks.length < cfg.minPick;
  const playable = !shortOfPicks && totalCost > 0;

  const screen = el(`<div class="j6-wrap j6-screen"></div>`);
  screen.setAttribute("aria-busy", S.busy || S.drawing ? "true" : "false");
  screen.appendChild(el(`<h2 class="sr-only">Just 6 — pick six of forty-eight</h2>`));

  /* ---------- top: the operator's art, with every live piece overlaid ---------- */
  const top = el(`<div class="j6-toppanel"></div>`);
  if (S.showResults && R) {
    top.appendChild(just6ResultsScreen(R, cfg, S));
  } else {
    const closePositions = new Set((R?.breakdown?.lines || []).filter((l) => l.close).map((l) => l.close));
    const dispWrap = el(`<div class="j6-display-wrap ${S.drawing ? "drawing" : ""}">
      <img class="j6-display-img" src="${JUST6_DISPLAY_IMG}" style="aspect-ratio:${JUST6_DISPLAY_AR}"
        alt="The Just 6 draw board: the ball machine in the middle, the five pre-number rings above it, and the thirty closing positions with their multipliers printed around the edge.">
    </div>`);
    dispWrap.appendChild(just6Drum());
    dispWrap.appendChild(el(`<div class="j6-hatch" data-hatch aria-hidden="true" style="left:${JUST6_HATCH_XY.x}%;top:${JUST6_HATCH_XY.y}%"><div class="j6-hatch-hole"></div><div class="j6-hatch-lid"></div></div>`));
    const reveal = el(`<div class="j6-ball j6-reveal" data-reveal aria-hidden="true"
      style="left:${JUST6_DISPENSER_XY.x}%;top:${JUST6_DISPENSER_XY.y}%"></div>`);
    dispWrap.appendChild(reveal);
    // Every printed circle gets a marker, pre-numbers included — this art has
    // a home for all 35 balls, so all 35 are placed live.
    for (let pos = 1; pos <= cfg.draw; pos++) {
      const n = R?.drawn[pos - 1];
      const isHit = n != null && S.picks.includes(n);
      const xy = JUST6_POS_XY[pos];
      const cls = ["j6-slot", pos <= cfg.preNumbers ? "pre" : "", n == null ? "" : "j6-ball",
        isHit ? "hit" : "", closePositions.has(pos) ? "close" : ""].filter(Boolean).join(" ");
      const slot = el(`<div class="${cls}" data-pos="${pos}" aria-hidden="true" style="left:${xy.x}%;top:${xy.y}%"></div>`);
      if (n != null) j6PaintBall(slot, n);
      dispWrap.appendChild(slot);
    }
    top.appendChild(dispWrap);
  }
  screen.appendChild(top);

  /* ---------- toolbar: home / sound … PLAY … clear / stake ---------- */
  const toolbar = el(`<div class="j6-toolbar" role="group" aria-label="Game controls"></div>`);
  const leftIcons = el(`<div class="j6-toolbar-side"></div>`);
  const homeBtn = el(`<button class="j6-iconbtn" data-fk="home" aria-label="Leave Just 6 and go back to all games"><svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg></button>`);
  homeBtn.onclick = () => { if (S.busy || S.drawing) return; currentGameId = null; kenoState = null; render(); };
  const soundBtn = el(`<button class="j6-iconbtn" data-fk="sound" aria-pressed="${soundEnabled}" aria-label="Sound">${soundEnabled ? `<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.8a9 9 0 0 1 0 12.4"/></svg>` : `<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="m16 9.5 5 5"/><path d="m21 9.5-5 5"/></svg>`}</button>`);
  soundBtn.onclick = () => { soundEnabled = !soundEnabled; announce(soundEnabled ? "Sound on" : "Sound off"); refresh(); };
  leftIcons.append(homeBtn, soundBtn);

  const playBtn = el(`<button class="j6-playpill" data-fk="play" aria-disabled="${S.busy || S.drawing || !playable}" aria-describedby="j6-playhint">${S.drawing ? "Drawing…" : S.busy ? "…" : "Play"}</button>`);
  playBtn.onclick = () => {
    if (S.busy || S.drawing) return;
    if (shortOfPicks) { toast(`Pick ${cfg.minPick}–${cfg.maxPick} numbers, or clear them and bet a speciality only`, "bad"); return; }
    if (totalCost <= 0) { toast("Choose some numbers or a speciality bet first", "bad"); return; }
    runJust6();
  };

  const rightIcons = el(`<div class="j6-toolbar-side right"></div>`);
  const trashBtn = el(`<button class="j6-iconbtn" data-fk="clear" aria-label="Clear all bets" aria-disabled="${S.busy || S.drawing}"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"/><path d="M9.5 6.5V4.5h5v2"/><path d="M6.5 6.5 7.5 20h9l1-13.5"/><path d="M10.5 10v6M13.5 10v6"/></svg></button>`);
  trashBtn.onclick = () => {
    if (S.busy || S.drawing) return;
    S.picks = []; S.side = {}; S.lastRound = null; announce("All bets cleared"); refresh();
  };
  const betStep = el(`<div class="j6-betstepper" role="group" aria-label="Stake per line"></div>`);
  const atMin = S.stake <= cfg.minStake, atMax = S.stake >= cfg.maxStake;
  betStep.appendChild(el(`<span class="lbl" aria-hidden="true">Bet</span>`));
  // Steps by 1 up to 10, then by 5 above it — both directions. The buttons stay
  // focusable at the limits (aria-disabled, not disabled) so tabbing through
  // the toolbar never dead-ends.
  const mkStep = (dir, label, glyph, off) => {
    const b = el(`<button data-fk="bet-${dir > 0 ? "up" : "down"}" aria-label="${label}" aria-disabled="${off}"><span aria-hidden="true">${glyph}</span></button>`);
    b.onclick = () => {
      if (S.busy || S.drawing || off) return;
      const v = S.stake;
      const next = dir > 0 ? (v < 10 ? v + 1 : v + 5) : (v <= 10 ? v - 1 : v - 5);
      S.stake = Math.min(cfg.maxStake, Math.max(cfg.minStake, next));
      refresh();
      announce(`Stake ${S.stake} points per line. ${just6CostSentence(S, cfg)}`);
    };
    return b;
  };
  betStep.appendChild(mkStep(-1, "Lower the stake", "▼", atMin || S.busy || S.drawing));
  betStep.appendChild(el(`<span class="val">${S.stake}<span class="sr-only"> points per line</span></span>`));
  betStep.appendChild(mkStep(1, "Raise the stake", "▲", atMax || S.busy || S.drawing));
  rightIcons.append(trashBtn, betStep);
  toolbar.append(leftIcons, playBtn, rightIcons);
  screen.appendChild(toolbar);

  /* ---------- bottom: number grid (left) + quick pick / colour / speciality ---------- */
  const bottom = el(`<div class="j6-bottom"></div>`);
  const boardWrap = el(`<div></div>`);
  boardWrap.appendChild(el(`<span class="j6-fieldhead" id="j6-numbers-head">Your numbers — <b>pick ${cfg.minPick} to ${cfg.maxPick}</b></span>`));
  // Forty-eight buttons is forty-eight Tab presses to get past the grid. One
  // roving tab stop plus arrow keys is the way a grid of controls is meant to
  // behave, and it leaves the rest of the cabinet two presses away.
  boardWrap.appendChild(el(`<span class="sr-only" id="j6-numbers-help">Use the arrow keys to move between numbers, then Space to pick one.</span>`));
  const board = el(`<div class="board j6-board" role="group" aria-labelledby="j6-numbers-head" aria-describedby="j6-numbers-help"></div>`);
  const locked = S.busy || S.drawing;
  if (!S.focusN || S.focusN < 1 || S.focusN > cfg.pool) S.focusN = S.picks[0] || 1;
  for (let n = 1; n <= cfg.pool; n++) {
    const picked = S.picks.includes(n);
    const at = R ? R.drawn.indexOf(n) : -1;
    const cls = R && picked && at >= 0 ? "hit" : R && at >= 0 ? "drawn" : "";
    const state = at >= 0 ? `, drawn at position ${at + 1}` : "";
    const b = el(`<button class="spot ${cls}" data-fk="n-${n}" tabindex="${n === S.focusN ? 0 : -1}" aria-pressed="${picked}" aria-disabled="${locked}" aria-label="${n}${state}">${n}</button>`);
    b.addEventListener("focus", () => { S.focusN = n; });
    b.onclick = () => {
      if (locked) return;
      if (S.picks.includes(n)) S.picks = S.picks.filter((x) => x !== n);
      else {
        if (S.picks.length >= cfg.maxPick) { toast(`Up to ${cfg.maxPick} numbers`, "bad"); return; }
        S.picks.push(n);
      }
      S.lastRound = null;
      refresh();
      announce(just6CostSentence(S, cfg));
    };
    board.appendChild(b);
  }
  board.addEventListener("keydown", (e) => {
    const step = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
    const cols = getComputedStyle(board).gridTemplateColumns.split(" ").length;
    const row = { ArrowUp: -cols, ArrowDown: cols }[e.key];
    let to = null;
    if (step) to = S.focusN + step;
    else if (row) to = S.focusN + row;
    else if (e.key === "Home") to = 1;
    else if (e.key === "End") to = cfg.pool;
    if (to == null) return;
    e.preventDefault();
    to = Math.min(cfg.pool, Math.max(1, to));
    const next = board.querySelector(`[data-fk="n-${to}"]`);
    if (next) { S.focusN = to; next.focus(); }
  });
  boardWrap.appendChild(board);
  bottom.appendChild(boardWrap);

  const sidecol = el(`<div class="j6-sidecol"></div>`);

  const randBlock = el(`<div></div>`);
  randBlock.appendChild(el(`<span class="j6-fieldhead" id="j6-quick-head">Quick pick</span>`));
  const randRow = el(`<div class="j6-randomrow" role="group" aria-labelledby="j6-quick-head"></div>`);
  [6, 7, 8].forEach((n) => {
    const b = el(`<button class="j6-randbtn" data-fk="rand-${n}" aria-disabled="${locked}" aria-label="Pick ${n} numbers at random">${n}</button>`);
    b.onclick = () => {
      if (locked) return;
      S.picks = pickRandom(range(1, cfg.pool), n); S.lastRound = null;
      refresh();
      announce(`Picked ${S.picks.slice().sort((a, b2) => a - b2).join(", ")}. ${just6CostSentence(S, cfg)}`);
    };
    randRow.appendChild(b);
  });
  const resultHistBtn = el(`<button class="j6-histlink" data-fk="result-history">Result History</button>`);
  resultHistBtn.onclick = () => openJust6ResultHistory();
  randRow.appendChild(resultHistBtn);
  const histBtn = el(`<button class="j6-histlink" data-fk="history">Win History</button>`);
  histBtn.onclick = () => openJust6History();
  randRow.appendChild(histBtn);
  randBlock.appendChild(randRow);
  sidecol.appendChild(randBlock);

  sidecol.appendChild(el(`<p class="j6-hint" id="j6-playhint">${esc(just6CostSentence(S, cfg))}</p>`));

  const colourBlock = el(`<div></div>`);
  const chosen = S.side.colour;
  colourBlock.appendChild(el(`<span class="j6-fieldhead" id="j6-colour-head">First ball colour <b>${JUST6_SPECIALITIES.colour.pay}×</b> — ${chosen ? `betting ${esc(chosen)}` : "no bet"}</span>`));
  const colourRow = el(`<div class="j6-colourrow" role="group" aria-labelledby="j6-colour-head"></div>`);
  JUST6_COLOURS.forEach((c) => {
    const on = chosen === c;
    const sw = el(`<button class="swatch" data-fk="col-${c}" aria-pressed="${on}" aria-disabled="${locked}"
      aria-label="${esc(c)}" style="background:${JUST6_HEX[c]}"><span aria-hidden="true">${on ? "✓" : ""}</span></button>`);
    sw.onclick = () => {
      if (locked) return;
      if (S.side.colour === c) delete S.side.colour; else S.side.colour = c;
      S.lastRound = null;
      refresh();
      announce(S.side.colour ? `Colour bet: ${c}. ${just6CostSentence(S, cfg)}` : `Colour bet cleared. ${just6CostSentence(S, cfg)}`);
    };
    colourRow.appendChild(sw);
  });
  colourBlock.appendChild(colourRow);
  sidecol.appendChild(colourBlock);

  // Grid order matches the reference layout: Sum(Under/Over), First(Even/Odd), First(Under/Over), Sum(Even/Odd).
  const specGrid = el(`<div class="j6-specgrid"></div>`);
  ["sum_ou", "first_parity", "first_ou", "sum_parity"].forEach((key) => {
    const spec = JUST6_SPECIALITIES[key];
    const group = el(`<div class="j6-specgroup"></div>`);
    group.appendChild(el(`<span class="j6-fieldhead" id="j6-spec-${key}">${esc(spec.label)} <b>${spec.pay}×</b></span>`));
    const seg = el(`<div class="seg" role="group" aria-labelledby="j6-spec-${key}"></div>`);
    spec.options.forEach((o) => {
      const on = S.side[key] === o;
      const b = el(`<button data-fk="spec-${key}-${o}" aria-pressed="${on}" aria-disabled="${locked}" aria-label="${esc(spec.label)}: ${esc(o)}">${esc(o)}</button>`);
      b.onclick = () => {
        if (locked) return;
        if (S.side[key] === o) delete S.side[key]; else S.side[key] = o;
        S.lastRound = null;
        refresh();
        announce(`${spec.label}: ${S.side[key] ? o : "no bet"}. ${just6CostSentence(S, cfg)}`);
      };
      seg.appendChild(b);
    });
    group.appendChild(seg);
    specGrid.appendChild(group);
  });
  sidecol.appendChild(specGrid);

  if (totalCost > 0) sidecol.appendChild(el(`<div class="cost-line total"><span>Total stake</span><span class="mono">${nice(totalCost)} pts</span></div>`));

  bottom.appendChild(sidecol);
  screen.appendChild(bottom);

  // The printed multipliers are the paytable, and on a phone they are about
  // five pixels tall. Here they are again, as text, selectable and zoomable.
  const pt = el(`<details class="j6-paytable-text"><summary>Paytable — what each closing position pays</summary></details>`);
  pt.appendChild(just6PaytableTable(cfg, false));
  screen.appendChild(pt);

  if (R) screen.appendChild(just6Result(R, cfg));
  view.appendChild(screen);
  // Only once it is in the document, so the drum can measure itself.
  const layer = screen.querySelector(".j6-drum-balls");
  if (layer && S.drawing && !matchMedia("(prefers-reduced-motion: reduce)").matches) just6DrumStart(layer);
  else just6DrumStop();

  async function runJust6() {
    const side = {};
    Object.entries(S.side).forEach(([k, pick]) => (side[k] = { pick, stake: S.stake }));
    const err = modules.just6.validate(S.picks, S.stake, cfg, side);
    if (err) { toast(err, "bad"); return; }
    if (me.points < totalCost) { toast(`Need ${nice(totalCost)} points`, "bad"); return; }
    S.busy = true; S.drawing = true; S.showResults = false; S.lastRound = null;
    refresh();                                        // the machine starts turning right away
    announce("The machine is drawing.");
    try {
      const round = await engine.play({ userId: session.userId, gameId: "just6", selection: S.picks.slice(), stake: S.stake, side });
      S.busy = false;
      await animateJust6(round, cfg, S);              // it keeps turning through every ball
      S.drawing = false;
      S.lastRound = round;
      S.showResults = true;
      render();
      const msg = round.win > 0 ? `Won ${nice(round.win)} points!` : "No win this time";
      toast(msg, round.win > 0 ? "ok" : "");
      announce(round.win > 0 ? `Draw complete. You won ${nice(round.win)} points.` : "Draw complete. No win this time.");
      // The results takeover clears itself, but never out from under someone
      // who is reading it — any focus inside cancels the timer, and there is
      // an explicit way out.
      S.resultsTimer = setTimeout(() => { if (kenoState === S) just6ClearForNextBet(S); }, 6500);
    } catch (e) {
      S.busy = false; S.drawing = false; render();
      toast(e.message, "bad"); announce(e.message);
    }
  }
}

// One sentence covering what is staked and what is missing — shown under the
// controls, spoken on every change, and used as the Play button's description.
function just6CostSentence(S, cfg) {
  const lines = S.picks.length >= cfg.minPick ? combinations(S.picks, cfg.minPick).length : 0;
  const sideCount = Object.keys(S.side).length;
  const total = lines * S.stake + sideCount * S.stake;
  if (S.picks.length > 0 && S.picks.length < cfg.minPick)
    return `${S.picks.length} of ${cfg.minPick} numbers chosen — pick ${cfg.minPick - S.picks.length} more, or clear them and bet a speciality on its own.`;
  if (!total) return `Nothing staked yet. Pick ${cfg.minPick} to ${cfg.maxPick} numbers, or choose a speciality bet.`;
  const bits = [];
  if (lines) bits.push(`${S.picks.length} numbers, ${lines} line${lines > 1 ? "s" : ""}`);
  if (sideCount) bits.push(`${sideCount} speciality bet${sideCount > 1 ? "s" : ""}`);
  return `${bits.join(" and ")} at ${S.stake} points each — ${nice(total)} points in total.`;
}

// Leaving the results screen puts the board back the way it was before the
// draw — balls off the display, the strip gone, nothing marked on the grid —
// but keeps the numbers, speciality bets and stake, so the next round is one
// press away rather than a rebuild.
function just6ClearForNextBet(S) {
  S.showResults = false;
  S.lastRound = null;
  render();
  announce(S.picks.length || Object.keys(S.side).length
    ? "Board cleared. Your bet is still set — press Play for the next round."
    : "Board cleared, ready for the next bet.");
}

function openJust6History() {
  const body = el(`<div class="stack"></div>`);
  const h = api.player.history(session.userId, "just6", 20);
  if (!h.length) body.appendChild(el(`<p class="muted">Your plays will show here.</p>`));
  else {
    const strip = el(`<div class="hist-strip"></div>`);
    h.forEach((r) => strip.appendChild(el(`<span class="hchip ${r.win > 0 ? "w" : ""}" title="${fmtTime(r.ts)} · ${esc(r.detail || "")}">${r.win > 0 ? "+" + nice(r.win) : "−" + nice(r.stake)}</span>`)));
    body.appendChild(strip);
  }
  modal({ title: "Just 6 — win history", bodyNodes: body, confirmText: "Close", onConfirm() {} });
}

function openJust6ResultHistory() {
  const body = el(`<div class="stack"></div>`);
  const h = api.player.history(session.userId, "just6", 20);
  if (!h.length) body.appendChild(el(`<p class="muted">Your draws will show here.</p>`));
  else {
    h.forEach((r) => {
      const row = el(`<div class="j6-rhrow"></div>`);
      row.appendChild(el(`<div class="j6-rhtime muted">${esc(fmtTime(r.ts))}</div>`));
      const balls = el(`<div class="j6-rhballs" aria-label="Numbers drawn, in order"></div>`);
      (r.drawn || []).forEach((n, i) => balls.appendChild(j6Ball(n, {
        cls: i < 5 ? "pre" : "", size: "22px",
        label: `${i < 5 ? "Pre-number" : "Ball"} ${i + 1}: ${n}`,
      })));
      row.appendChild(balls);
      body.appendChild(row);
    });
  }
  modal({ title: "Just 6 — result history", bodyNodes: body, confirmText: "Close", onConfirm() {}, wide: true });
}

/* ---------------------------------------------------------------------------
   The draw. Balls tumble in the machine from the moment Play is pressed; each
   one then flips up enlarged over the glass (a coin turning to face you),
   holds long enough to read, cross-fades away and drops into its printed
   circle. Timed frame-by-frame off the reference product.

   Three things are non-negotiable here and are handled below: the whole run is
   well over five seconds of movement, so it can be skipped at any point; every
   ball is announced as it lands, since none of this is visible to a screen
   reader; and reduced-motion settings get the result without the theatre.
   ------------------------------------------------------------------------- */
// Per ball: the port swings open, the ball clears it, swells to fill the
// glass, holds long enough to read, then fades back into the machine.
const J6_FLAP_MS = 150, J6_OUT_MS = 110, J6_GROW_MS = 380, J6_HOLD_MS = 480, J6_FADE_MS = 200;
// The machine spins up before it gives you anything — without this the first
// ball is already in the air by the time the drum has faded in.
const J6_PREROLL_MS = 1700;

async function animateJust6(round, cfg, S) {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const reveal = document.querySelector("[data-reveal]");
  const hatch = document.querySelector("[data-hatch]");
  const slotAt = (pos) => document.querySelector(`.j6-slot[data-pos="${pos}"]`);
  const picks = round.selection;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  const land = (n, pos) => {
    const isHit = picks.includes(n);
    const slot = slotAt(pos);
    if (slot) {
      j6PaintBall(slot, n);
      slot.classList.add("j6-ball", "land");
      if (isHit) slot.classList.add("hit");
    }
    announce(`${just6PosLabel(pos, cfg)}: ${n}${isHit ? ", your number" : ""}`);
  };

  if (!reduce) await wait(J6_PREROLL_MS);      // balls churning, nothing drawn yet

  for (let i = 0; i < round.drawn.length; i++) {
    const n = round.drawn[i];
    if (reveal && !reduce) {
      j6PaintBall(reveal, n);
      if (hatch) hatch.classList.add("open");                    // the port swings open
      await wait(J6_FLAP_MS);
      reveal.className = "j6-ball j6-reveal out";                // the ball clears the port
      await wait(J6_OUT_MS);
      reveal.className = "j6-ball j6-reveal show";               // and swells over the glass
      await wait(J6_GROW_MS * 0.5);
      if (hatch) hatch.classList.remove("open");                 // port shuts behind it
      await wait(J6_GROW_MS * 0.5 + J6_HOLD_MS);                 // hold, long enough to read
      reveal.className = "j6-ball j6-reveal show fade";          // then back into the machine
      await wait(J6_FADE_MS);
      reveal.className = "j6-ball j6-reveal";
    }
    land(n, i + 1);
  }
  if (reveal) { reveal.className = "j6-ball j6-reveal"; reveal.innerHTML = ""; }
  if (hatch) hatch.classList.remove("open");
  (round.breakdown?.lines || []).filter((l) => l.close).forEach((l) => {
    const slot = slotAt(l.close);
    if (slot) slot.classList.add("close");
  });
}

function just6Result(round, cfg) {
  const bd = round.breakdown || {};
  const win = round.win > 0;
  const box = el(`<div class="result ${win ? "win" : "lose"}"></div>`);
  box.appendChild(el(`<div class="big">${win ? "+" + nice(round.win) + " points" : "No win"}</div>`));

  let mainLine = "";
  if (round.selection.length >= 6) {
    const wonLines = (bd.lines || []).filter((l) => l.win > 0).length;
    mainLine = round.selection.length === 6
      ? (bd.lines?.[0]?.close ? `Six closed at position ${bd.lines[0].close} — ${bd.lines[0].mult}×` : `${round.hits.length}/6 drawn — set not completed`)
      : `System ${round.selection.length}: ${wonLines} of ${bd.lines.length} lines won (${nice(bd.mainBeforeBonus)})`;
    if (bd.bonusApplied) mainLine += ` · bonus ×${cfg.bonus.multiplier} → ${nice(bd.mainWin)}`;
  }
  if (mainLine) box.appendChild(el(`<div class="sm">${esc(mainLine)}</div>`));
  if (bd.bonusPos != null) box.appendChild(el(`<div class="sm">Bonus symbol on position ${bd.bonusPos} (ball ${bd.bonusNumber})${bd.bonusHit ? " — you hit it" : ""}</div>`));

  (bd.specials || []).forEach((s) => box.appendChild(el(
    `<div class="sm">${esc(s.label)}: you ${esc(s.pick)} · drew ${esc(String(s.result))} — ${s.won ? `<b style="color:var(--jade)">+${nice(s.win)}</b>` : "no"}</div>`
  )));

  if (round.selection.length > 6 && (bd.lines || []).some((l) => l.win > 0)) {
    const det = el(`<details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:12.5px">Line breakdown</summary><div class="j6-lines"><table><caption class="sr-only">Winning lines, the position each closed at and what it paid</caption><tbody></tbody></table></div></details>`);
    const tb = det.querySelector("tbody");
    bd.lines.filter((l) => l.win > 0).sort((a, b) => a.close - b.close).forEach((l) =>
      tb.appendChild(el(`<tr><td>${l.combo.join(" ")}</td><td>@${l.close}</td><td>${l.mult}×</td><td>+${nice(l.win)}</td></tr>`)));
    box.appendChild(det);
  }
  box.appendChild(el(`<div class="sm mono" style="opacity:.7;margin-top:6px;font-size:11.5px">seed ${esc((round.serverSeed || "").slice(0, 16))}…</div>`));
  return box;
}

// The "Results Round" takeover shown after the last ball, matching
// Desktop/JUST6_results.png. It clears itself, but reading speed is nobody
// else's business: focus inside it cancels the timer, and Continue closes it.
function just6ResultsScreen(round, cfg, S) {
  const bd = round.breakdown || {};
  const pre = bd.pre || round.drawn.slice(0, cfg.preNumbers);
  const sum = pre.reduce((a, b) => a + b, 0);

  const box = el(`<section class="j6-results" aria-labelledby="j6-results-head" tabindex="-1"></section>`);
  box.appendChild(el(`<h3 id="j6-results-head">Results Round</h3>`));

  const preRow = el(`<div class="j6-results-pre" role="group" aria-label="The five pre-numbers"></div>`);
  pre.forEach((n, i) => preRow.appendChild(j6Ball(n, { label: `Pre ${i + 1}: ${n}` })));
  box.appendChild(preRow);

  box.appendChild(el(`<div class="j6-results-sub">Pre numbers sum <b>${sum}</b> (${sum > 122.5 ? "over" : "under"} 122.5) · <b>${sum % 2 ? "odd" : "even"}</b></div>`));

  const grid = el(`<div class="j6-results-grid" role="group" aria-label="The thirty closing positions"></div>`);
  for (let pos = cfg.bonus.from; pos <= cfg.draw; pos++) {
    const n = round.drawn[pos - 1];
    const mult = fmtMult(cfg.paytable[pos] || 0);
    const cell = el(`<div class="j6-results-cell"></div>`);
    cell.appendChild(j6Ball(n, { label: `Position ${pos}: ball ${n}, pays ${mult} times` }));
    cell.appendChild(el(`<div class="mult" aria-hidden="true">${mult}×</div>`));
    grid.appendChild(cell);
  }
  box.appendChild(grid);

  const close = el(`<button class="j6-results-close" data-fk="results-close">Continue</button>`);
  close.onclick = () => { clearTimeout(S.resultsTimer); just6ClearForNextBet(S); };
  box.appendChild(close);
  box.addEventListener("focusin", () => clearTimeout(S.resultsTimer));
  return box;
}

function just6PaytableTable(cfg, editable) {
  const t = el(`<div style="overflow-x:auto"><table class="paytable-mini"><thead><tr><th>Position</th>${range(cfg.bonus.from, cfg.draw).map((p) => `<th>${p}</th>`).join("")}</tr></thead><tbody><tr><td style="text-align:left">Multiplier</td></tr></tbody></table></div>`);
  const tr = t.querySelector("tbody tr");
  for (let p = cfg.bonus.from; p <= cfg.draw; p++) {
    if (editable) {
      const td = el(`<td></td>`);
      td.appendChild(el(`<input class="editable-cell mono" value="${cfg.paytable[p] ?? 0}" data-pos="${p}">`));
      tr.appendChild(td);
    } else tr.appendChild(el(`<td>${fmtMult(cfg.paytable[p] || 0)}×</td>`));
  }
  return t;
}

/* =========================================================================
   PLAYER — HOT DICE
   ========================================================================= */
// Real pip faces (not font glyphs) — a 3×3 grid, cells lit per the classic dice layout.
const DIE_PIP_MAP = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
function dieFaceHTML(n) {
  const active = new Set(DIE_PIP_MAP[n] || []);
  let cells = "";
  for (let i = 0; i < 9; i++) cells += `<span class="pip ${active.has(i) ? "on" : ""}"></span>`;
  return `<div class="pips">${cells}</div>`;
}
// The dice jar — hand-built in SVG (no source art for Hot Dice yet): a glass
// dome on a dark base with a gold rim, echoing the glass vessels used for
// Keno's ball machine and Just 6's dispenser.
function hdJarSVG() {
  return `<svg class="hd-jar-svg" viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="hdGlass" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fff" stop-opacity=".22"/>

function viewHotDice(view) {
  const game = engine.game("hotdice");
  const cfg = game.config;
  const me = api.player.me(session.userId);
  if (!kenoState || kenoState.gameId !== "hotdice")
    kenoState = { gameId: "hotdice", slip: {}, chip: 5, busy: false, lastRound: null, auto: false, autoLeft: 0, locked: false };
  const S = kenoState;
  const refresh = () => viewHotDice(clearAndReturn(view));

  const R = S.lastRound;
  const rolledTotal = R ? R.breakdown.total : null;
  const slipTotal = Object.values(S.slip).reduce((a, b) => a + b, 0);
  const wonKeys = new Set(R ? R.breakdown.bets.filter((b) => b.won).map((b) => b.key) : []);

  const addBet = (key) => {
    if (S.busy || S.locked) return;
    S.slip[key] = Math.min(cfg.maxStake, (S.slip[key] || 0) + S.chip);
    S.lastRound = null; refresh();
  };
  const clearBet = (key) => { if (S.busy || S.locked) return; delete S.slip[key]; refresh(); };

  const spotEl = (key, top, sub) => {
    const on = S.slip[key] > 0;
    const b = el(`<div class="hd-spot ${on ? "on" : ""} ${wonKeys.has(key) ? "hit" : ""}">
      ${on ? `<span class="s">${S.slip[key]}</span>` : ""}
      <span class="o">${sub}</span>
    </div>`);
    const topNode = top instanceof Node ? top : el(`<span class="t">${top}</span>`);
    b.insertBefore(topNode, b.querySelector(".o"));
    b.onclick = () => addBet(key);
    b.oncontextmenu = (e) => { e.preventDefault(); clearBet(key); };
    return b;
  };

  const wrap = el(`<div class="keno hd-wrap"></div>`);

  /* ---------- left: dice table ---------- */
  const left = el(`<div class="stack"></div>`);
  const table = el(`<div class="card pad stack"></div>`);
  table.appendChild(el(`<div class="row-between"><h3 style="font-size:15px">The dice table</h3><span class="muted">right-click a spot to clear it</span></div>`));

  const grid = el(`<div class="hd-grid"></div>`);
  for (let s = 3; s <= 18; s++) grid.appendChild(spotEl(String(s), s, cfg.odds[s] + "×"));
  table.appendChild(grid);

  const bars = el(`<div class="hd-bars"></div>`);
  [["small", "Small", "3–10"], ["big", "Big", "11–18"], ["odd", "Odd", cfg.evenMoney + "×"], ["even", "Even", cfg.evenMoney + "×"]].forEach(([k, t, sub]) =>
    bars.appendChild(spotEl(k, t, sub)));
  table.appendChild(bars);

  const hard = el(`<div class="hd-hard"></div>`);
  for (let n = 1; n <= 6; n++) hard.appendChild(spotEl("hard" + n, el(`<div class="mini-die">${dieFaceHTML(n)}</div>`), cfg.hardWay + "×"));
  table.appendChild(hard);
  left.appendChild(table);

  /* ---------- bet controls ---------- */
  const panel = el(`<div class="card pad bet-panel"></div>`);
  const chips = el(`<div class="hd-controls"></div>`);
  chips.appendChild(el(`<span class="muted" style="font-size:11px">Chip</span>`));
  [1, 2, 5, 10, 25].forEach((c) => {
    const b = el(`<button class="hd-chip ${S.chip === c ? "on" : ""}">${c}</button>`);
    b.onclick = () => { S.chip = c; refresh(); };
    chips.appendChild(b);
  });
  panel.appendChild(chips);

  const acts = el(`<div class="hd-controls"></div>`);
  const allBtn = el(`<button class="btn sm">ALL</button>`);
  allBtn.onclick = () => { if (S.busy || S.locked) return; for (let s = 3; s <= 18; s++) S.slip[String(s)] = Math.min(cfg.maxStake, (S.slip[String(s)] || 0) + S.chip); S.lastRound = null; refresh(); };
  const clrBtn = el(`<button class="btn sm ghost">C — clear all</button>`);
  clrBtn.onclick = () => { if (S.busy || S.locked) return; S.slip = {}; S.lastRound = null; refresh(); };
  const autoBtn = el(`<button class="btn sm ${S.auto ? "primary" : ""}">${S.auto ? "Auto ON" : "Auto"}</button>`);
  autoBtn.onclick = () => { S.auto = !S.auto; refresh(); if (S.auto) autoTick(); };
  acts.append(allBtn, clrBtn, autoBtn);
  panel.appendChild(acts);

  const nextRow = el(`<div class="hd-controls"></div>`);
  nextRow.appendChild(el(`<span class="muted" style="font-size:11px">Next</span>`));
  [5, 10, 20, 50].forEach((n) => {
    const b = el(`<button class="btn sm">${n}</button>`);
    b.onclick = () => {
      if (S.busy || S.locked || !slipTotal) { if (!slipTotal) toast("Place a bet first", "bad"); return; }
      S.autoLeft = n; S.locked = true; refresh(); autoTick();
    };
    nextRow.appendChild(b);
  });
  panel.appendChild(nextRow);
  if (S.locked) panel.appendChild(el(`<p class="muted" style="font-size:11px">Locked — ${S.autoLeft} round${S.autoLeft === 1 ? "" : "s"} left, bet can't be cancelled.</p>`));

  panel.appendChild(el(`<hr class="sep">`));
  const slipBox = el(`<div class="stack" style="gap:3px"></div>`);
  Object.entries(S.slip).filter(([, v]) => v > 0).forEach(([k, v]) =>
    slipBox.appendChild(el(`<div class="cost-line"><span>${esc(hotDiceSpotLabel(k))}</span><span class="mono">${v}</span></div>`)));
  slipBox.appendChild(el(`<div class="cost-line total"><span>Total stake</span><span class="mono">${nice(slipTotal)} pts</span></div>`));
  panel.appendChild(slipBox);

  const playBtn = el(`<button class="btn primary" style="width:100%;padding:12px;font-size:15px">${S.busy ? "Rolling…" : S.locked ? `Auto — ${S.autoLeft} left` : "Roll"}</button>`);
  playBtn.disabled = S.busy || S.locked || slipTotal <= 0;
  playBtn.onclick = () => runHotDice();
  panel.appendChild(playBtn);
  left.appendChild(panel);
  wrap.appendChild(left);

  /* ---------- right: dice jar + info ---------- */
  const right = el(`<div class="stack"></div>`);
  const stage = el(`<div class="hd-stage"></div>`);
  const jarWrap = el(`<div class="hd-jar-wrap">${hdJarSVG()}<div class="hd-dice-cluster" data-cluster></div></div>`);
  const cluster = jarWrap.querySelector("[data-cluster]");
  for (let i = 0; i < cfg.dice; i++) {
    const v = R?.breakdown.dice[i];
    cluster.appendChild(el(`<div class="hd-die ${v == null ? "idle" : ""}">${dieFaceHTML(v || 1)}</div>`));
  }
  stage.appendChild(jarWrap);
  stage.appendChild(el(`<div class="hd-total">${rolledTotal != null ? `Total ${rolledTotal}` : "&nbsp;"}</div>`));
  if (R) stage.appendChild(hotDiceResult(R));
  right.appendChild(stage);

  const info = el(`<div class="card pad stack" style="gap:12px"></div>`);
  info.appendChild(el(`<div class="row-between"><h3 style="font-size:15px">Hot Dice</h3><span class="muted">${cfg.minStake}–${cfg.maxStake} pts / bet</span></div>`));
  const infoTabs = el(`<div class="game-tabs" style="margin:0"></div>`);
  const infoBody = el(`<div data-infobody></div>`);
  ["Rules", "Odds", "History"].forEach((t, i) => {
    const b = el(`<button class="game-tab ${i === 0 ? "on" : ""}" style="padding:6px 12px;font-size:12px">${t}</button>`);
    b.onclick = () => { infoTabs.querySelectorAll(".game-tab").forEach((x) => x.classList.remove("on")); b.classList.add("on"); paintInfo(i); };
    infoTabs.appendChild(b);
  });
  info.append(infoTabs, infoBody);
  function paintInfo(i) {
    infoBody.innerHTML = "";
    if (i === 0) infoBody.appendChild(el(`<p class="muted" style="line-height:1.6">${esc(game.blurb)} Pick a chip value, click spots to stack bets, right-click to clear one. <b>ALL</b> covers every total, <b>C</b> clears, <b>Auto</b> repeats your slip every roll, <b>Next N</b> runs a locked set of rounds. Hard Way = an exact triple (e.g. 4·4·4).</p>`));
    if (i === 1) {
      const rows = hotDiceRTP(cfg);
      const t = el(`<div style="overflow-x:auto"><table class="paytable-mini"><thead><tr><th>Bet</th><th>Chance</th><th>Pays</th><th>RTP</th></tr></thead><tbody></tbody></table></div>`);
      rows.forEach((r) => t.querySelector("tbody").appendChild(el(`<tr><td style="text-align:left">${esc(hotDiceSpotLabel(r.bet) || r.bet)}</td><td>${(r.prob * 100).toFixed(1)}%</td><td>${r.pay}×</td><td style="color:var(--violet)">${(r.rtp * 100).toFixed(1)}%</td></tr>`)));
      infoBody.appendChild(t);
    }
    if (i === 2) {
      const h = api.player.history(session.userId, "hotdice", 20);
      if (!h.length) { infoBody.appendChild(el(`<p class="muted">Your rolls will show here.</p>`)); return; }
      const strip = el(`<div class="hist-strip"></div>`);
      h.forEach((r) => strip.appendChild(el(`<span class="hchip ${r.win > 0 ? "w" : ""}" title="${fmtTime(r.ts)} · ${esc(r.detail || "")}">${(r.breakdown?.dice || []).join("-") || "?"} · ${r.win > 0 ? "+" + nice(r.win) : "−" + nice(r.stake)}</span>`)));
      infoBody.appendChild(strip);
    }
  }
  paintInfo(0);
  right.appendChild(info);
  wrap.appendChild(right);
  view.appendChild(wrap);

  async function runHotDice() {
    const slip = { ...S.slip };
    const err = modules.hotdice.validate([], 0, cfg, slip);
    if (err) { toast(err, "bad"); S.locked = false; S.auto = false; refresh(); return; }
    const cost = Object.values(slip).reduce((a, b) => a + b, 0);
    if (me.points < cost) { toast(`Need ${nice(cost)} points`, "bad"); S.locked = false; S.auto = false; refresh(); return; }
    S.busy = true; refresh();
    try {
      const round = await engine.play({ userId: session.userId, gameId: "hotdice", selection: [], stake: 0, side: slip });
      S.busy = false;
      await animateHotDice(round);
      S.lastRound = round;
      if (S.autoLeft > 0) { S.autoLeft--; if (S.autoLeft === 0) S.locked = false; }
      render();
      toast(round.win > 0 ? `Won ${nice(round.win)} points!` : "No win", round.win > 0 ? "ok" : "");
      if ((S.auto || S.autoLeft > 0) && !S.busy) autoTick();
    } catch (e) { S.busy = false; S.locked = false; S.auto = false; render(); toast(e.message, "bad"); }
  }

  function autoTick() {
    if (S.busy) return;
    if (!S.auto && S.autoLeft <= 0) return;
    const cost = Object.values(S.slip).reduce((a, b) => a + b, 0);
    if (cost <= 0 || wallet.balance(session.userId) < cost) { S.auto = false; S.autoLeft = 0; S.locked = false; toast("Auto stopped", ""); render(); return; }
    setTimeout(() => { if (S.auto || S.autoLeft > 0) runHotDice(); }, 850);
  }
}

// Shake the jar and scramble each die's face, then settle on the real roll —
// one continuous beat, not a per-die reveal.
async function animateHotDice(round) {
  const jarWrap = document.querySelector(".hd-jar-wrap");
  const dice = [...document.querySelectorAll(".hd-die")];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  jarWrap?.classList.remove("win");
  dice.forEach((d) => d.classList.remove("idle"));

  if (!reduce) {
    jarWrap?.classList.add("shaking");
    dice.forEach((d) => d.classList.add("rolling"));
    const scramble = setInterval(() => {
      dice.forEach((d) => (d.innerHTML = dieFaceHTML(1 + Math.floor(Math.random() * 6))));
    }, 80);
    await new Promise((r) => setTimeout(r, 650));
    clearInterval(scramble);
    jarWrap?.classList.remove("shaking");
    dice.forEach((d) => d.classList.remove("rolling"));
  }

  round.breakdown.dice.forEach((v, i) => {
    if (!dice[i]) return;
    dice[i].innerHTML = dieFaceHTML(v);
    if (!reduce) { dice[i].classList.remove("settle"); void dice[i].offsetWidth; dice[i].classList.add("settle"); }
  });
  if (round.win > 0) jarWrap?.classList.add("win");
}

function hotDiceResult(round) {
  const bd = round.breakdown;
  const win = round.win > 0;
  const box = el(`<div class="result ${win ? "win" : "lose"}"></div>`);
  box.appendChild(el(`<div class="big">${win ? "+" + nice(round.win) + " points" : "No win"}</div>`));
  box.appendChild(el(`<div class="sm">Rolled ${bd.dice.join(" · ")} = ${bd.total}</div>`));
  bd.bets.forEach((b) => box.appendChild(el(
    `<div class="sm">${esc(b.label)} · ${nice(b.stake)} → ${b.won ? `<b style="color:var(--jade)">+${nice(b.win)}</b> (${b.mult}×)` : "no"}</div>`
  )));
  box.appendChild(el(`<div class="sm mono" style="opacity:.6;margin-top:5px">seed ${esc((round.serverSeed || "").slice(0, 16))}…</div>`));
  return box;
}

/* ---- simple games (dice / wheel) -------------------------------------- */
function viewSimpleGame(view, gameId) {
  const game = engine.game(gameId);
  const cfg = game.config;
  const me = api.player.me(session.userId);
  if (!kenoState || kenoState.gameId !== gameId) kenoState = { gameId, selection: null, stake: 2, busy: false, lastRound: null };
  const S = kenoState;

  const wrap = el(`<div class="split"></div>`);
  const left = el(`<div class="card pad stack"></div>`);
  left.appendChild(el(`<h3 style="font-size:15px">${esc(game.name)}</h3>`));
  left.appendChild(el(`<p class="muted">${esc(game.blurb)}</p>`));

  const opts = el(`<div class="selrow"></div>`);
  const choices = gameId === "dice" ? range(1, cfg.faces) : Object.keys(cfg.payouts);
  choices.forEach((c) => {
    const on = S.selection === c || S.selection === Number(c);
    const b = el(`<button class="btn ${on ? "primary" : ""}">${gameId === "wheel" ? esc(c) + " · " + cfg.payouts[c] + "×" : c}</button>`);
    b.onclick = () => { S.selection = gameId === "dice" ? Number(c) : c; S.lastRound = null; viewSimpleGame(clearAndReturn(view), gameId); };
    opts.appendChild(b);
  });
  left.appendChild(opts);

  const stakeRow = el(`<div class="row-between"></div>`);
  stakeRow.appendChild(el(`<label class="f" style="margin:0">Stake</label>`));
  const step = el(`<div class="stepper"><button data-d="-1">−</button><span class="val">${S.stake}</span><button data-d="1">+</button></div>`);
  step.querySelectorAll("button").forEach((b) => (b.onclick = () => {
    S.stake = Math.min(cfg.maxStake, Math.max(cfg.minStake, S.stake + Number(b.dataset.d) * (S.stake >= 10 ? 5 : 1)));
    step.querySelector(".val").textContent = S.stake;
  }));
  stakeRow.appendChild(step);
  left.appendChild(stakeRow);

  const playBtn = el(`<button class="btn primary" style="width:100%;padding:11px">${S.busy ? "Playing…" : gameId === "dice" ? "Roll" : "Spin"}</button>`);
  playBtn.disabled = S.busy || S.selection == null;
  playBtn.onclick = async () => {
    S.busy = true; viewSimpleGame(clearAndReturn(view), gameId);
    try {
      const round = await engine.play({ userId: session.userId, gameId, selection: [S.selection], stake: S.stake });
      S.lastRound = round; S.busy = false;
      render();
      toast(round.win > 0 ? `Won ${nice(round.win)}!` : "No win", round.win > 0 ? "ok" : "");
    } catch (e) { S.busy = false; render(); toast(e.message, "bad"); }
  };
  left.appendChild(playBtn);
  wrap.appendChild(left);

  const right = el(`<div class="card pad stack"></div>`);
  right.appendChild(el(`<h3 style="font-size:15px">Result</h3>`));
  if (S.lastRound) {
    right.appendChild(el(`<div class="result ${S.lastRound.win > 0 ? "win" : "lose"}"><div class="big">${S.lastRound.win > 0 ? "+" + nice(S.lastRound.win) : "No win"}</div><div class="sm">${esc(S.lastRound.detail)}</div></div>`));
  } else right.appendChild(el(`<p class="muted">Make a call and play.</p>`));
  const hist = api.player.history(session.userId, gameId, 20);
  if (hist.length) {
    const strip = el(`<div class="hist-strip"></div>`);
    hist.forEach((r) => strip.appendChild(el(`<span class="hchip ${r.win > 0 ? "w" : ""}">${r.win > 0 ? "+" + nice(r.win) : "−" + nice(r.stake)}</span>`)));
    right.appendChild(strip);
  }
  wrap.appendChild(right);
  view.appendChild(wrap);
}

      <td class="mono" style="color:var(--ink-dim)">${fmtTime(t.ts)}</td>

function openTransfer(mode, agentUserId, target) {
  const amt = field(mode === "allocate" ? "Points to allocate" : "Points to recall", "points", { type: "number", placeholder: "0" });
  modal({
    title: `${mode === "allocate" ? "Allocate to" : "Recall from"} ${target.name}`,
    bodyNodes: [el(`<p class="muted">${mode === "allocate" ? "Moves points from your balance to theirs." : "Moves points from their balance back to yours."}</p>`), amt],
    confirmText: mode === "allocate" ? "Allocate" : "Recall",
    onConfirm() {
      const p = Number(readForm(amt.parentElement).points);
      if (mode === "allocate") api.agent.allocate(agentUserId, target.id, p);
      else api.agent.recall(target.id, agentUserId, p);
      toast(`${mode === "allocate" ? "Allocated" : "Recalled"} ${nice(p)} points`, "ok");
      render();
    },
  });
}

function openCreateChild(parentUserId, childKind, done) {
  const nodes = [
    field("Name", "name"),
    field("Email" + (childKind === "player" ? " (optional)" : ""), "email", { type: "email" }),
    field("Password" + (childKind === "player" ? " (optional)" : ""), "password", { type: "text" }),
  ];
  if (childKind !== "player") nodes.push(field("Commission %", "commissionRate", { type: "number", value: 4 }));
  nodes.push(field("Starting points (optional)", "points", { type: "number", placeholder: "0" }));
  const box = el(`<div class="stack"></div>`);
  nodes.forEach((n) => box.appendChild(n));
  modal({
    title: `New ${KIND_LABEL[childKind]}`,
    bodyNodes: box,
    confirmText: "Create",
    onConfirm() {
      const f = readForm(box);
      agents.create(parentUserId, {
        name: f.name, email: f.email, password: f.password,
        commissionRate: Number(f.commissionRate) || 4, points: Number(f.points) || 0,
      });
      toast(`${f.name} created`, "ok");
      done && done();
    },
  });
}

function viewAdminGames(view) {
  head(view, "Games", "Enable a game, or tune its paytable. Adding a new game = one module + one row here.");
  const games = api.admin.games();
  const stack = el(`<div class="stack"></div>`);
  games.forEach((g) => {
    const card = el(`<div class="card pad stack"></div>`);
    const hd = el(`<div class="row-between"><div><h3 style="font-size:16px">${esc(g.name)} <span class="pill dim">${g.kind}</span></h3><p class="muted" style="margin:3px 0 0">${esc(g.blurb)}</p></div></div>`);
    const toggle = el(`<button class="btn sm ${g.enabled ? "" : "primary"}">${g.enabled ? "Disable" : "Enable"}</button>`);
    toggle.onclick = () => { api.admin.setGameEnabled(g.id, !g.enabled); toast(`${g.name} ${g.enabled ? "disabled" : "enabled"}`, "ok"); render(); };
    hd.appendChild(toggle);
    card.appendChild(hd);

    if (g.id === "keno") {
      const table = kenoPaytableTable(g.config, true);
      card.appendChild(table);
      const save = el(`<button class="btn sm primary" style="align-self:flex-start">Save paytable</button>`);
      save.onclick = () => {
        const pt = KENO_PAYTABLE(); // fresh shape
        const next = {};
        table.querySelectorAll("input[data-p]").forEach((i) => {
          const p = +i.dataset.p, h = +i.dataset.h, v = parseFloat(i.value) || 0;
          next[p] = next[p] || {};
          if (v > 0) next[p][h] = v;
        });
        api.admin.updatePaytable("keno", next);
        toast("Paytable saved — RTP recalculated", "ok");
        render();
      };
      card.appendChild(save);
      card.appendChild(el(`<p class="muted" style="font-size:11.5px">RTP column is theoretical hold per pick level (hypergeometric on ${g.config.pool} numbers, ${g.config.draw} drawn). Spec values as written range roughly 62–95% — the maths, not a bug to fix here.</p>`));
    } else if (g.id === "just6") {
      const table = just6PaytableTable(g.config, true);
      card.appendChild(table);
      const save = el(`<button class="btn sm primary" style="align-self:flex-start">Save paytable</button>`);
      save.onclick = () => {
        const next = {};
        table.querySelectorAll("input[data-pos]").forEach((i) => { const v = parseFloat(i.value) || 0; if (v > 0) next[+i.dataset.pos] = v; });
        api.admin.updatePaytable("just6", next);
        toast("Just 6 paytable saved", "ok");
        render();
      };
      card.appendChild(save);
      const rtpRow = el(`<div class="row-between"><p class="muted" style="font-size:11.5px;margin:0">Main-game RTP has no closed form — run a Monte-Carlo estimate. (Bonus symbol is disabled — flip <code>bonus.enabled</code> to bring it back; it would lower hold further.)</p></div>`);
      const rtpBtn = el(`<button class="btn sm">Estimate RTP</button>`);
      const rtpOut = el(`<span class="mono muted" style="font-size:12px"></span>`);
      rtpBtn.onclick = () => {
        rtpBtn.disabled = true; rtpBtn.textContent = "Running 20k…";
        setTimeout(() => {
          const r = just6RTP(g.config, 20000);
          rtpOut.textContent = `  straight ${(r[6] * 100).toFixed(1)}% · sys-7 ${(r[7] * 100).toFixed(1)}% · sys-8 ${(r[8] * 100).toFixed(1)}%`;
          rtpBtn.disabled = false; rtpBtn.textContent = "Re-run";
        }, 30);
      };
      rtpRow.append(rtpBtn, rtpOut);
      card.appendChild(rtpRow);
      card.appendChild(el(`<p class="muted" style="font-size:11.5px">Speciality bets: ${Object.entries(JUST6_SPECIALITIES).map(([k, s]) => `${s.label.replace(/ — .*/, "")} ${s.pay}×`).join(" · ")}. Colour is 1-in-8 paying 4.5× (≈56% RTP) — per spec.</p>`));
    } else if (g.id === "hotdice") {
      const table = el(`<div style="overflow-x:auto"><table class="paytable-mini"><thead><tr><th>Total</th>${range(3, 18).map((s) => `<th>${s}</th>`).join("")}</tr></thead><tbody><tr><td style="text-align:left">Pays</td></tr></tbody></table></div>`);
      const tr = table.querySelector("tbody tr");
      for (let s = 3; s <= 18; s++) {
        const td = el(`<td></td>`);
        td.appendChild(el(`<input class="editable-cell mono" value="${g.config.odds[s]}" data-total="${s}">`));
        tr.appendChild(td);
      }
      card.appendChild(table);
      const save = el(`<button class="btn sm primary" style="align-self:flex-start">Save odds</button>`);
      save.onclick = () => {
        const next = {};
        table.querySelectorAll("input[data-total]").forEach((i) => { next[+i.dataset.total] = parseFloat(i.value) || 0; });
        api.admin.updateGameConfig("hotdice", { odds: next });
        toast("Hot Dice odds saved", "ok"); render();
      };
      card.appendChild(save);
      const worst = hotDiceRTP(g.config).reduce((m, r) => Math.min(m, r.rtp), 1);
      const best = hotDiceRTP(g.config).reduce((m, r) => Math.max(m, r.rtp), 0);
      card.appendChild(el(`<p class="muted" style="font-size:11.5px">Even-money (Small/Big, Odd/Even) ${g.config.evenMoney}× · Hard Way ${g.config.hardWay}×. Theoretical RTP across all bets ${(worst * 100).toFixed(1)}%–${(best * 100).toFixed(1)}% (3d6, 216 outcomes). Total bets as speced carry a ~31–37% edge — steep; confirm before launch. Triples ${g.config.triplesLoseEvenMoney ? "void" : "do not void"} even-money bets.</p>`));
    } else {
      const cfgStr = Object.entries(g.config).filter(([k]) => !["segments"].includes(k)).map(([k, v]) => `${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`).join("  ·  ");
      card.appendChild(el(`<p class="mono muted" style="font-size:12px">${esc(cfgStr)}</p>`));
    }
    stack.appendChild(card);
  });
  view.appendChild(stack);
}

function viewAdminAgents(view) {
  const roots = api.admin.agentTree();
  head(view, "Agents", "super → master → agent → player. Points flow down; recalls flow up.");

  // operator can mint a super directly
  const mintSuper = el(`<button class="btn primary sm">+ New super agent</button>`);
  mintSuper.onclick = () => {
    const box = el(`<div class="stack"></div>`);
    [field("Name", "name"), field("Email", "email", { type: "email" }), field("Password", "password"), field("Commission %", "commissionRate", { type: "number", value: 8 }), field("Starting float", "points", { type: "number", placeholder: "0" })].forEach((n) => box.appendChild(n));
    modal({
      title: "New super agent", bodyNodes: box, confirmText: "Create",
      onConfirm() {
        const f = readForm(box);
        store.tx((d) => {
          const u = { id: uid("usr"), name: f.name, email: f.email.toLowerCase(), password: f.password || null, role: "super", points: 0, agentId: null, status: "active", createdAt: now() };
          d.users.push(u);
          d.agents.push({ id: uid("agt"), userId: u.id, kind: "super", commissionRate: Number(f.commissionRate) || 8, parentAgentId: null, createdAt: now() });
          const pts = Number(f.points) || 0;
          if (pts > 0) { u.points = pts; d.transactions.push({ id: uid("tx"), userId: u.id, type: "topup", amount: pts, balanceAfter: pts, note: "Float issued by operator", ts: now() }); }
        });
        toast(`${f.name} created`, "ok"); render();
      },
    });
  };
  view.querySelector(".view-head").appendChild(el(`<div class="sp"></div>`));
  view.querySelector(".view-head").appendChild(mintSuper);

  const treeCard = el(`<div class="card pad"><div class="tree"></div></div>`);
  const treeEl = treeCard.querySelector(".tree");
  const walk = (node, depth) => {
    const u = node.user;
    const row = el(`<div class="tnode" style="margin-left:${depth * 20}px">
      <span class="kind ${node.kind}">${node.kind}</span>
      <b>${esc(u.name)}</b>
      <span class="muted">${esc(u.email || "")}</span>
      <span class="pts">${nice(u.points)}</span>
    </div>`);
    const topup = el(`<button class="btn sm ghost" style="margin-left:8px">Top up</button>`);
    topup.onclick = () => {
      const amt = field("Points", "points", { type: "number" });
      modal({ title: `Top up ${u.name}`, bodyNodes: amt, confirmText: "Add points", onConfirm() { api.admin.topUp(u.id, Number(readForm(amt.parentElement).points)); toast("Points added", "ok"); render(); } });
    };
    row.appendChild(topup);
    if (KIND_CHILD[node.kind] && KIND_CHILD[node.kind] !== "player") {
      const addChild = el(`<button class="btn sm" style="margin-left:6px">+ ${KIND_LABEL[KIND_CHILD[node.kind]]}</button>`);
      addChild.onclick = () => openCreateChild(u.id, KIND_CHILD[node.kind], render);
      row.appendChild(addChild);
    }
    treeEl.appendChild(row);
    node.children.forEach((c) => walk(c, depth + 1));
    if (node.playerCount) treeEl.appendChild(el(`<div class="tnode" style="margin-left:${(depth + 1) * 20}px;opacity:.65"><span class="kind">players</span><span class="muted">${node.playerCount} recruited player${node.playerCount === 1 ? "" : "s"}</span></div>`));
  };
  roots.forEach((r) => walk(r, 0));
  if (!roots.length) treeCard.querySelector(".tree").appendChild(el(`<div class="empty-state">No agents yet.</div>`));
  view.appendChild(treeCard);
}

function viewAdminPlayers(view) {
  head(view, "Players", "Everyone who plays. Search, adjust points, suspend.");
  const bar = el(`<div class="card pad" style="margin-bottom:16px"><input class="i" id="pq" placeholder="Search name or email…"></div>`);
  view.appendChild(bar);
  const host = el(`<div></div>`);
  view.appendChild(host);
  const paint = () => {
    const q = bar.querySelector("#pq").value.trim();
    const list = api.admin.users({ role: "player", q });
    host.innerHTML = "";
    const wrap = el(`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Agent</th><th>Status</th><th style="text-align:right">Points</th><th style="text-align:right">Actions</th></tr></thead><tbody></tbody></table></div>`);
    const tb = wrap.querySelector("tbody");
    if (!list.length) tb.appendChild(el(`<tr><td colspan="6" class="muted" style="text-align:center;padding:24px">No players match.</td></tr>`));
    list.forEach((u) => {
      const tr = el(`<tr>
        <td><b>${esc(u.name)}</b></td>
        <td class="muted">${esc(u.email || "—")}</td>
        <td class="muted">${esc(api.admin.userName(u.agentId))}</td>
        <td><span class="pill ${u.status === "active" ? "ok" : "bad"}">${u.status}</span></td>
        <td class="mono" style="text-align:right">${nice(u.points)}</td>
        <td style="text-align:right"></td>
      </tr>`);
      const act = tr.lastElementChild;
      const adj = el(`<button class="btn sm">Adjust</button>`);
      adj.onclick = () => {
        const amt = field("Delta (+ or −)", "d", { type: "number", placeholder: "e.g. 100 or -50" });
        modal({ title: `Adjust ${u.name}`, bodyNodes: amt, confirmText: "Apply", onConfirm() { api.admin.adjust(u.id, Number(readForm(amt.parentElement).d)); toast("Adjusted", "ok"); paint(); } });
      };
      const susp = el(`<button class="btn sm ${u.status === "active" ? "danger" : ""}">${u.status === "active" ? "Suspend" : "Reinstate"}</button>`);
      susp.onclick = () => { api.admin.setStatus(u.id, u.status === "active" ? "suspended" : "active"); toast("Status updated", "ok"); paint(); };
      act.append(adj, " ", susp);
      tb.appendChild(tr);
    });
    host.appendChild(wrap);
  };
  bar.querySelector("#pq").addEventListener("input", paint);
  paint();
}
